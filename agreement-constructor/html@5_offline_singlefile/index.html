ort\'}} г. р.[[end]][[if p.relation]] ({{p.relation}})[[end]][[if index < count(occupants)]]; [[end]][[end]].[[else]]Иные лица постоянно проживать в Квартире не будут.[[end]] Временное проживание гостей не более 7 (семи) дней подряд не требует согласия Наймодателя.','[[if occupants]]The following persons will live in the Flat with the Tenant: [[each occupants as p]]{{p.name}}[[if p.birthDate]], born {{p.birthDate|date:\'short\'}}[[end]][[if p.relation]] ({{p.relation}})[[end]][[if index < count(occupants)]]; [[end]][[end]].[[else]]No other persons will live in the Flat permanently.[[end]] Guests staying up to 7 (seven) days in a row need no consent of the Landlord.')},{id:'handover',text:L('Квартира передаётся с мебелью, бытовой техникой и оборудованием[[if act]] по акту приёма-передачи (Приложение № {{#actApp}}), в котором фиксируются её состояние, опись имущества и показания приборов учёта[[end]].','The Flat is let with its furniture, appliances and fittings[[if act]] under the act of acceptance (Appendix {{#actApp}}) recording its condition, the inventory and the meter readings[[end]].')},]},{id:'termSec',title:L('Срок найма','Term'),clauses:[{id:'termCl',text:L('Договор заключён на {{term.months}} ({{term.months|words}}) {{term.months|plural:\'месяц\',\'месяца\',\'месяцев\'}}: с {{term.start}} по {{term.last}} включительно. Наниматель освобождает и возвращает Квартиру Наймодателю не позднее {{term.end}}.','The Agreement is concluded for {{term.months}} ({{term.months|words}}) {{term.months|plural:\'month\',\'months\'}}: from {{term.start}} to {{term.last}} inclusive. The Tenant vacates the Flat and returns it to the Landlord no later than {{term.end}}.')},{id:'effect',text:L('Договор вступает в силу с момента подписания и действует до полного исполнения Сторонами своих обязательств.','The Agreement enters into force on signing and remains in force until the Parties have fully performed their obligations.')},{id:'renewal',by:'strictness',text:L('',''),variants:{soft:L('Если ни одна из Сторон не позднее чем за 30 (тридцать) дней до окончания срока не заявит о прекращении Договора, он считается продлённым на тот же срок на тех же условиях.','Unless either Party gives notice of termination no later than 30 (thirty) days before the end of the term, the Agreement is renewed for the same term on the same terms.'),standard:L('По окончании срока Договор может быть продлён по соглашению Сторон. Наниматель, надлежащим образом исполнявший свои обязанности, имеет преимущественное право на заключение договора на новый срок.','At the end of the term the Agreement may be renewed by agreement of the Parties. A Tenant who has duly performed the Agreement has a preferential right to a new lease.'),strict:L('Продление Договора возможно только по письменному соглашению Сторон, подписанному не позднее чем за 30 (тридцать) дней до окончания срока. Пользование Квартирой после окончания срока без такого соглашения не допускается.','The Agreement may be renewed only by a written agreement of the Parties signed no later than 30 (thirty) days before the end of the term. The Flat may not be used after the term without such an agreement.')}},]},{id:'payment',title:L('Плата и расчёты','Rent and payments'),clauses:[{id:'rentCl',text:L('Плата за наём Квартиры составляет {{rent}} в месяц.','The rent for the Flat is {{rent}} a month.')},{id:'periods',text:L('Расчётный период — один месяц. Каждый расчётный период начинается в число месяца, в которое начинается найм, и заканчивается днём, предшествующим этому числу следующего месяца; последний расчётный период заканчивается {{term.last}}. Расчётные периоды и суммы приведены в графике платежей (Приложение № {{#scheduleApp}}): {{schedule.count}} {{schedule.count|plural:\'платёж\',\'платежа\',\'платежей\'}} на общую сумму {{schedule.total}}.','The billing period is one month. Each period starts on the day of the month on which the lease started and ends on the day before that day of the next month; the last period ends on {{term.last}}. The periods and amounts are listed in the payment schedule (Appendix {{#scheduleApp}}): {{schedule.count}} {{schedule.count|plural:\'payment\',\'payments\'}}, {{schedule.total}} in total.')},{id:'prorataCl',when:'schedule.partialCount > 0',text:L('[[if schedule.settings.prorata]]Плата за неполный расчётный период рассчитывается пропорционально количеству дней в нём.[[else]]Плата за неполный расчётный период вносится в полном размере.[[end]]','[[if schedule.settings.prorata]]The rent for a part period is pro rata to its days.[[else]]The rent for a part period is paid in full.[[end]]')},{id:'due',text:L('Плата вносится авансом [[if schedule.settings.dueOffset < 0]]не позднее чем за {{-schedule.settings.dueOffset}} ({{-schedule.settings.dueOffset|words}}) {{-schedule.settings.dueOffset|plural:\'день\',\'дня\',\'дней\'}} до начала[[elif schedule.settings.dueOffset > 0]]в течение {{schedule.settings.dueOffset}} ({{schedule.settings.dueOffset|words:\'f\'}}) {{schedule.settings.dueOffset|plural:\'дня\',\'дней\',\'дней\'}} с начала[[else]]не позднее первого дня[[end]] каждого расчётного периода [[if payMethod == \'cash\']]наличными денежными средствами под расписку Наймодателя[[else]]переводом по реквизитам: {{bankDetails}}[[end]]. Плата за первый расчётный период вносится при подписании Договора.','The rent is paid in advance [[if schedule.settings.dueOffset < 0]]no later than {{-schedule.settings.dueOffset}} ({{-schedule.settings.dueOffset|words}}) {{-schedule.settings.dueOffset|plural:\'day\',\'days\'}} before the start[[elif schedule.settings.dueOffset > 0]]within {{schedule.settings.dueOffset}} ({{schedule.settings.dueOffset|words}}) {{schedule.settings.dueOffset|plural:\'day\',\'days\'}} of the start[[else]]no later than the first day[[end]] of each billing period [[if payMethod == \'cash\']]in cash against the Landlord\'s receipt[[else]]by transfer to: {{bankDetails}}[[end]]. The rent for the first period is paid on signing.')},{id:'depositCl',by:'strictness',text:L('',''),variants:{soft:L('При подписании Договора Наниматель вносит обеспечительный платёж {{deposit}}. Он возвращается Нанимателю в день возврата Квартиры за вычетом документально подтверждённого ущерба и может быть зачтён в плату за последний расчётный период.','On signing the Tenant pays a deposit of {{deposit}}. It is returned on the day the Flat is returned, less documented damage, and may be set off against the rent of the last period.'),standard:L('При подписании Договора Наниматель вносит обеспечительный платёж {{deposit}}. Он возвращается в течение 3 (трёх) дней после возврата Квартиры по акту за вычетом задолженности по оплате и стоимости устранения повреждений сверх нормального износа.','On signing the Tenant pays a deposit of {{deposit}}. It is returned within 3 (three) days after the Flat is returned under the act, less unpaid amounts and the cost of repairing damage beyond normal wear.'),strict:L('При подписании Договора Наниматель вносит обеспечительный платёж {{deposit}}. Он не засчитывается в плату за наём и возвращается в течение 10 (десяти) дней после возврата Квартиры по акту за вычетом задолженности, ущерба и неустоек. При выезде до окончания срока без уведомления за {{noticeDays}} ({{noticeDays|words}}) {{noticeDays|plural:\'день\',\'дня\',\'дней\'}} обеспечительный платёж не возвращается.','On signing the Tenant pays a deposit of {{deposit}}. It is not set off against the rent and is returned within 10 (ten) days after the Flat is returned under the act, less unpaid amounts, damage and penalties. If the Tenant leaves before the end of the term without {{noticeDays}} ({{noticeDays|words}}) days\' notice, the deposit is not returned.')}},{id:'utilitiesCl',text:L('[[if utilities == \'included\']]Плата за коммунальные услуги включена в плату за наём; услуги связи и интернета Наниматель оплачивает сам.[[else]]Наниматель дополнительно оплачивает коммунальные услуги по показаниям приборов учёта (электроэнергия, холодная и горячая вода, водоотведение, газ) и услуги связи. Плату за содержание жилого помещения и взносы на капитальный ремонт вносит Наймодатель.[[end]]','[[if utilities == \'included\']]Utilities are included in the rent; the Tenant pays for telephone and internet.[[else]]The Tenant also pays for the utilities by the meters (electricity, cold and hot water, sewerage, gas) and for telephone and internet. The Landlord pays the maintenance charges and the capital repair contributions.[[end]]')},{id:'servicesCl',when:'extraServices',text:L('Наймодатель оказывает Нанимателю дополнительные услуги, перечисленные в Приложении № {{#servicesApp}}, общей стоимостью {{servicesTotal}} в месяц; стоимость услуг вносится вместе с платой за наём.','The Landlord provides the additional services listed in Appendix {{#servicesApp}}, {{servicesTotal}} a month in total, paid together with the rent.')},{id:'lateFee',by:'strictness',text:L('',''),variants:{soft:L('При просрочке платы более чем на 5 (пять) дней Наниматель уплачивает неустойку {{lateFeePct|num}} % от неоплаченной суммы за каждый день просрочки, начиная с шестого.','If a payment is more than 5 (five) days late, the Tenant pays a penalty of {{lateFeePct|num}} % of the unpaid amount for each day from the sixth.'),standard:L('За просрочку платы Наниматель уплачивает неустойку {{lateFeePct|num}} % от неоплаченной суммы за каждый день просрочки.','For a late payment the Tenant pays a penalty of {{lateFeePct|num}} % of the unpaid amount for each day of delay.'),strict:L('За просрочку платы Наниматель уплачивает неустойку {{lateFeePct|num}} % от неоплаченной суммы за каждый день просрочки. Просрочка более 10 (десяти) дней даёт Наймодателю право отказаться от Договора в одностороннем порядке.','For a late payment the Tenant pays a penalty of {{lateFeePct|num}} % of the unpaid amount for each day of delay. A delay of more than 10 (ten) days entitles the Landlord to withdraw from the Agreement unilaterally.')}},]},{id:'landlordDuties',title:L('Обязанности Наймодателя','Obligations of the Landlord'),clauses:[{id:'ld1',text:L('Передать Нанимателю Квартиру в состоянии, пригодном для проживания, свободной от проживания третьих лиц, в день начала найма.','To hand over the Flat fit for living and free of other occupants on the first day of the lease.')},{id:'ld2',text:L('Обеспечивать предоставление коммунальных услуг и производить капитальный ремонт Квартиры и её оборудования.','To ensure the supply of utilities and carry out major repairs of the Flat and its equipment.')},{id:'ld3',by:'strictness',text:L('',''),variants:{soft:L('Посещать Квартиру только по согласованию с Нанимателем и в его присутствии, предупредив не менее чем за 48 (сорок восемь) часов, кроме аварийных ситуаций.','To visit the Flat only by arrangement and in the Tenant\'s presence, with at least 48 (forty-eight) hours\' notice, except emergencies.'),standard:L('Посещать Квартиру для проверки её состояния не чаще одного раза в месяц, предупредив Нанимателя не менее чем за 24 (двадцать четыре) часа, кроме аварийных ситуаций.','To inspect the Flat no more than once a month with at least 24 (twenty-four) hours\' notice, except emergencies.'),strict:L('Посещать Квартиру для проверки её состояния, предупредив Нанимателя не менее чем за 12 (двенадцать) часов; в аварийных ситуациях — без предупреждения.','To inspect the Flat with at least 12 (twelve) hours\' notice; in emergencies without notice.')}},{id:'ld4',text:L('Не позднее чем за {{noticeDays}} ({{noticeDays|words}}) {{noticeDays|plural:\'день\',\'дня\',\'дней\'}} письменно уведомлять Нанимателя о намерении расторгнуть Договор или продать Квартиру.','To give the Tenant written notice of {{noticeDays}} ({{noticeDays|words}}) days of an intention to terminate the Agreement or to sell the Flat.')},]},{id:'tenantDuties',title:L('Обязанности Нанимателя','Obligations of the Tenant'),clauses:[{id:'td1',text:L('Использовать Квартиру только для проживания, соблюдать правила пользования жилыми помещениями, санитарные и противопожарные нормы, права и законные интересы соседей.','To use the Flat only as a dwelling and to keep the rules of use of dwellings, sanitary and fire rules and the rights of the neighbours.')},{id:'td2',text:L('Своевременно вносить плату за наём и коммунальные услуги.','To pay the rent and the utilities on time.')},{id:'td3',text:L('Бережно относиться к Квартире и имуществу, не производить переустройство и перепланировку; немедленно сообщать Наймодателю о неисправностях и авариях.','To take good care of the Flat and its contents, make no alterations, and report faults and accidents to the Landlord at once.')},{id:'td4',text:L('Возместить ущерб, причинённый Квартире и имуществу по вине Нанимателя и проживающих с ним лиц.','To compensate damage to the Flat and its contents caused by the Tenant or the persons living with the Tenant.')},{id:'td5',text:L('По окончании найма вернуть Квартиру[[if act]] по акту[[end]] в том состоянии, в котором она была получена, с учётом нормального износа, вместе со всеми комплектами ключей.','At the end of the lease to return the Flat[[if act]] under an act[[end]] in the condition in which it was received, fair wear excepted, with every set of keys.')},]},{id:'special',title:L('Особые условия','Special terms'),when:'nuances',clauses:[{id:'petsCl',text:L('[[if pets]]Нанимателю разрешается содержать в Квартире домашних животных: {{petsDesc}}. Наниматель возмещает ущерб, причинённый животными, и оплачивает профессиональную уборку при выезде.[[else]]Содержание в Квартире домашних животных не допускается.[[end]]','[[if pets]]The Tenant may keep pets in the Flat: {{petsDesc}}. The Tenant compensates damage caused by the pets and pays for professional cleaning on leaving.[[else]]No pets may be kept in the Flat.[[end]]')},{id:'smokingCl',text:L('[[if smoking]]Курение допускается только на балконе (лоджии) при закрытых дверях в Квартиру.[[else]]Курение в Квартире, на балконе и в местах общего пользования запрещено; при нарушении Наниматель оплачивает химчистку мебели и текстиля.[[end]]','[[if smoking]]Smoking is allowed only on the balcony with the doors to the Flat closed.[[else]]No smoking in the Flat, on the balcony or in the common areas; for a breach the Tenant pays for cleaning the furniture and textiles.[[end]]')},{id:'subletCl',text:L('[[if sublet]]Наниматель вправе передавать Квартиру в поднаём только с предварительного письменного согласия Наймодателя.[[else]]Поднаём Квартиры, а также передача её во временное пользование третьим лицам (в том числе посуточно) не допускаются.[[end]]','[[if sublet]]The Tenant may sublet the Flat only with the Landlord\'s prior written consent.[[else]]The Flat may not be sublet or given for temporary use to anyone else (short lets included).[[end]]')},{id:'earlyCl',text:L('[[if earlyTermination]]Наниматель вправе досрочно отказаться от Договора, письменно предупредив Наймодателя не позднее чем за {{noticeDays}} ({{noticeDays|words}}) {{noticeDays|plural:\'день\',\'дня\',\'дней\'}}; при соблюдении этого срока штрафы не применяются, а плата за неиспользованные дни оплаченного периода возвращается.[[else]]При досрочном отказе от Договора по инициативе Нанимателя он уплачивает Наймодателю штраф {{earlyFee}}.[[end]]','[[if earlyTermination]]The Tenant may end the Agreement early by giving the Landlord {{noticeDays}} ({{noticeDays|words}}) days\' written notice; no fine applies then, and the rent for the unused days of a paid period is refunded.[[else]]If the Tenant ends the Agreement early, the Tenant pays the Landlord a fine of {{earlyFee}}.[[end]]')},{id:'repairsCl',when:'repairs',text:L('Наниматель вправе за свой счёт производить косметический ремонт по письменному согласованию с Наймодателем; стоимость ремонта не возмещается и в счёт платы не засчитывается.','The Tenant may redecorate at the Tenant\'s own cost with the Landlord\'s written approval; the cost is not refunded or set off against the rent.')},{id:'poaCl',when:'poa',text:L('Документ, подтверждающий полномочия представителя Наймодателя, предъявлен Нанимателю при подписании Договора; его копия передана Нанимателю. Плата, внесённая представителю, считается внесённой Наймодателю.','The document of authority of the Landlord\'s representative was shown to the Tenant on signing and a copy was given to the Tenant. Payments made to the representative count as made to the Landlord.')},{id:'otherCl',when:'otherTerms',text:L('{{otherTerms}}','{{otherTerms}}')},]},{id:'termination',title:L('Изменение и расторжение','Amendment and termination'),clauses:[{id:'tm1',text:L('Договор может быть изменён или расторгнут по соглашению Сторон, оформленному письменно.','The Agreement may be amended or terminated by a written agreement of the Parties.')},{id:'tm2',by:'strictness',text:L('',''),variants:{soft:L('Договор может быть расторгнут по требованию любой из Сторон в случаях, предусмотренных Гражданским кодексом Российской Федерации.','Either Party may demand termination in the cases provided by the Civil Code of the Russian Federation.'),standard:L('Наймодатель вправе потребовать расторжения Договора в случаях, предусмотренных законом, а также при нарушении Нанимателем срока внесения платы более двух раз подряд.','The Landlord may demand termination in the cases provided by law and if the Tenant pays late more than twice in a row.'),strict:L('Наймодатель вправе отказаться от Договора в одностороннем порядке, уведомив Нанимателя за 10 (десять) дней, при однократной просрочке платы более чем на 10 (десять) дней, при порче имущества[[if nuances]] или нарушении особых условий (раздел {{#special}})[[end]].','The Landlord may withdraw from the Agreement with 10 (ten) days\' notice if a payment is more than 10 (ten) days late, if property is damaged[[if nuances]] or if the special terms (section {{#special}}) are breached[[end]].')}},{id:'tm3',text:L('При расторжении Договора Наниматель освобождает Квартиру в срок, указанный в уведомлении или соглашении, и возвращает её[[if act]] по акту[[end]].','On termination the Tenant vacates the Flat by the date stated in the notice or the agreement and returns it[[if act]] under an act[[end]].')},]},{id:'final',title:L('Заключительные положения','Final provisions'),clauses:[{id:'f1',text:L('Споры разрешаются путём переговоров, а при недостижении согласия — в суде по месту нахождения Квартиры. Во всём, что не предусмотрено Договором, Стороны руководствуются законодательством Российской Федерации.','Disputes are settled by negotiation and, failing agreement, by the court at the location of the Flat. Matters not covered by the Agreement are governed by the law of the Russian Federation.')},{id:'f2',text:L('Договор составлен в двух экземплярах, имеющих равную юридическую силу, по одному для каждой из Сторон.','The Agreement is made in two counterparts of equal force, one for each Party.')},{id:'f3',text:L('Неотъемлемые части Договора: Приложение № {{#scheduleApp}} — график платежей[[if extraServices]]; Приложение № {{#servicesApp}} — дополнительные услуги[[end]][[if act]]; Приложение № {{#actApp}} — акт приёма-передачи[[end]].','Integral parts of the Agreement: Appendix {{#scheduleApp}}, the payment schedule[[if extraServices]]; Appendix {{#servicesApp}}, additional services[[end]][[if act]]; Appendix {{#actApp}}, the act of acceptance[[end]].')},]},{id:'signs',kind:'signatures',title:L('Реквизиты и подписи Сторон','Details and signatures of the Parties'),clauses:[{id:'sigLandlord',text:L('**Наймодатель**\n{{landlord|details}}[[if poa]]\nПредставитель: {{agent.name}}\nна основании {{agentDoc}}[[end]]\n\n____________________ / [[if poa]]{{agent|initials}}[[else]]{{landlord|initials}}[[end]] /','**Landlord**\n{{landlord|details}}[[if poa]]\nRepresentative: {{agent.name}}\nunder {{agentDoc}}[[end]]\n\n____________________ / [[if poa]]{{agent|initials}}[[else]]{{landlord|initials}}[[end]] /')},{id:'sigTenant',text:L('**Наниматель**\n{{tenant|details}}\n\n____________________ / {{tenant|initials}} /','*
