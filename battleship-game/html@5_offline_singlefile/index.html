ame':'Tetromino fleet','preset.ex-tetromino.desc':'Exclusive. Ships are polyominoes: a straight four, an L, a T, an S, a square and two corner tugs. They may turn and be mirrored, never touch, and a sunk ship is shown — but a hit no longer tells you which way the hull goes.','preset.ex-arsenal.name':'Arsenal','preset.ex-arsenal.desc':'Exclusive. The classic game with weapons: two radar scans (how many ship cells hide in a 3 × 3 square), one air strike along four cells of a row or a column, one cluster bomb on a cross of five cells — and two mines in your sea: whoever hits one takes the same shot on their own board.','preset.ex-sonar.name':'Deep Sonar','preset.ex-sonar.desc':'Exclusive. A 12 × 12 sea in the fog: only “hit” or “miss”, no sinkings announced — but three sonar scans of 3 × 3 each. Information is the weapon.','tag.classic':'Classic','tag.small':'Small','tag.big':'Big sea','tag.salvo':'Salvos','tag.secret':'Secret sinkings','tag.party':'Party','tag.teams':'Teams','tag.exclusive':'Exclusive','tag.islands':'Islands','tag.shapes':'Shapes','tag.weapons':'Weapons','setup.title':'New game','setup.rules':'Rules','setup.all':'All','setup.own':'Mine','setup.noOwn':'No rulesets of your own yet — make one in the constructor.','setup.meta':'{w} × {h} · {ships} ships · {min}–{max} players','setup.howPlay':'How {name} plays','setup.players':'Players','setup.fewer':'Fewer players','setup.more':'More players','setup.seatsHint':'Tap an opponent to choose another bot, its level or a bot of your own.','setup.shuffle':'Bots and the first shooter','setup.prng':'Seed (shareable)','setup.csprng':'Secure random','setup.seed':'Seed','setup.seedAuto':'a new seed every game','setup.newSeed':'New seed','setup.prngHint':'A seed replays the same bot fleets, bot decisions and first shooter: share it to compare how you play the same battle.','setup.csprngHint':'The browser’s cryptographic random source: nobody can predict or repeat the game.','setup.start':'Place the fleet','lvl.1':'Easy и вода не отмечается. Остальное выводите сами.','preset.armada-14.name':'Армада 14 × 14','preset.armada-14.desc':'Море 14 × 14 и тринадцать кораблей от авианосца до трёх катеров; корабли могут касаться углами. Долгая охота.','preset.ocean-20.name':'Океан 20 × 20','preset.ocean-20.desc':'Открытый океан: 20 × 20 клеток и пятнадцать кораблей от шестипалубного танкера до пяти эсминцев, стрельба залпами по выстрелу за каждый уцелевший корабль.','preset.ffa.name':'Все против всех','preset.ffa.desc':'Три или четыре адмирала, все против всех: каждый ход выбирайте, по чьему морю стрелять. Попадание даёт ещё один выстрел; побеждает последний уцелевший флот.','preset.teams.name':'Двое на двое','preset.teams.desc':'Две команды по два флота; партнёры сидят друг напротив друга и стреляют только по другой команде. Команда проигрывает, когда потоплены оба её флота.','preset.ex-archipelago.name':'Архипелаг','preset.ex-archipelago.desc':'Эксклюзив. Море 12 × 10 с тринадцатью островами, на которых не может стоять корабль: острова известны всем и искажают вероятности вокруг себя. Флот Battleship, углы могут касаться, попадание даёт ещё один выстрел.','preset.ex-tetromino.name':'Флот тетромино','preset.ex-tetromino.desc':'Эксклюзив. Корабли — полимино: прямая четвёрка, L, T, S, квадрат и два буксира-уголка. Их можно поворачивать и отражать, они никогда не касаются, потопленный корабль показывают — но попадание больше не говорит, куда идёт корпус.','preset.ex-arsenal.name':'Арсенал','preset.ex-arsenal.desc':'Эксклюзив. Классическая игра с оружием: два сканирования радаром (сколько клеток кораблей скрыто в квадрате 3 × 3), один авиаудар вдоль четырёх клеток строки или столбца, одна кассетная бомба на крест из пяти клеток — и две мины в вашем море: кто попадёт в мину, получит такой же выстрел по своему полю.','preset.ex-sonar.name':'Глубокий сонар','preset.ex-sonar.desc':'Эксклюзив. Море 12 × 12 в тумане: только «попал» или «мимо», о потоплениях не объявляют — зато есть три сканирования сонаром 3 × 3. Информация — это оружие.','tag.classic':'Классика','tag.small':'Маленькое','tag.big':'Большое море','tag.salvo':'Залпы','tag.secret':'Тайные потопления','tag.party':'Компания','tag.teams':'Команды','tag.exclusive':'Эксклюзив','tag.islands':'Острова','tag.shapes':'Формы','tag.weapons':'Оружие','setup.title':'Новая игра','setup.rules':'Правила','setup.all':'Все','setup.own':'Мои','setup.noOwn':'Своих правил пока нет — создайте их в конструкторе.','setup.meta':'{w} × {h} · кораблей: {ships} · игроков: {min}–{max}','setup.howPlay':'Как играется {name}','setup.players':'Игроки','setup.fewer':'Меньше игроков','setup.more':'Больше игроков','setup.seatsHint':'Нажмите на соперника, чтобы выбрать другого бота, его уровень или своего бота.','setup.shuffle':'Боты и первый стрелок','setup.prng':'Зерно (можно поделиться)','setup.csprng':'Надёжный случай','setup.seed':'Зерно','setup.seedAuto':'новое зерно в каждой игре','setup.newSeed':'Новое зерно','setup.prngHint':'Зерно повторяет те же флоты ботов, решения ботов и первого стрелка: поделитесь им, чтобы сравнить, как вы играете один и тот же бой.','setup.csprngHint':'Криптографический источник случайности браузера: никто не сможет предсказать или повторить игру.','setup.start':'Расставить флот','lvl.1':'Лёгкий','lvl.2':'Обычный','lvl.3':'Сложный','lvl.4':'Эксперт','bp.title':'Выберите соперника','bp.mode':'Выбор бота','bp.templates':'Характеры','bp.build':'Собрать бота','bp.level':'Уровень','bp.rating':'Рейтинг на этом уровне (по симуляциям)','bp.beats':'Побеждает:','bp.loses':'Проигрывает:','bp.similar':'Похож на: {name}','bp.delete':'Удалить этого бота','bp.myBot':'Мой бот','bp.name':'Имя','bp.icon':'Значок','bp.base':'Начать с','bp.method':'Стрельба','bp.placement':'Расстановка','bp.targeting':'По кому стреляет','bp.traits':'Черты','bp.save':'Сохранить бота','bp.saved':'Бот сохранён','bp.use':'Использовать','bot.human':'Игрок-человек.','bot.custom.name':'Свой бот','bot.rookie.name':'Новичок','bot.rookie.summary':'Стреляет куда вздумается и добивает раненый корабль, только когда вспомнит; быстро ставит корабли один за другим и сразу пускает в ход оружие.','bot.rookie.p1':'случайные выстрелы','bot.rookie.p2':'наивное добивание','bot.rookie.p3':'быстрая расстановка','bot.hunter.name':'Охотник','bot.hunter.summary':'Классические «поиск и добивание»: ищет в шахматном порядке с шагом самого маленького уцелевшего корабля, добивает каждый раненый корабль вдоль его линии и нападает на самый слабый флот.','bot.hunter.p1':'шахматный поиск','bot.hunter.p2':'добивает раненых','bot.hunter.p3':'давит слабейшего','bot.cartographer.name':'Картограф','bot.cartographer.summary':'Считает все способы, которыми ещё могут стоять оставшиеся корабли, и стреляет туда, где их пересекается больше всего; свои корабли распределяет по морю равномерно.','bot.cartographer.p1':'плотность расстановок','bot.cartographer.p2':'разбросанный флот','bot.cartographer.p3':'лучший шанс где угодно','bot.statistician.name':'Статистик','bot.statistician.summary':'Генерирует целые флоты, согласные со всем увиденным, и стреляет в клетку, где корабль вероятнее всего; свой флот прячет равномерно случайно — это не использовать никаким априорным знанием.','bot.statistician.p1':'флоты Монте-Карло','bot.statistician.p2':'самая вероятная клетка','bot.statistician.p3':'неуязвимая расстановка','bot.scholar.name':'Учёный','bot.scholar.summary':'Задаёт вопросы, ответы на которые учат его больше всего: максимизирует ожидаемую информацию каждого выстрела, любит сканирования радаром и держит свои корабли подальше от краёв.','bot.scholar.p1':'максимум информации','bot.scholar.p2':'сначала радар','bot.scholar.p3':'корабли в открытом море','bot.corsair.name':'Корсар','bot.corsair.summary':'Жмётся своими кораблями к берегам и ждёт того же от остальных: сначала прочёсывает края, атакует самый сильный флот и рано пускает в ход оружие.','bot.corsair.p1':'корабли вдоль краёв','bot.corsair.p2':'сначала ищет у краёв','bot.corsair.p3':'атакует лидера','bot.ghost.name':'Призрак','bot.ghost.summary':'Прячется там, где охотники по плотности ищут в последнюю очередь, и бережёт оружие до эндшпиля; его выстрелы направляют сгенерированные флоты, и он добивает самого слабого.','bot.ghost.p1':'расстановка против плотности','bot.ghost.p2':'терпеливое оружие','bot.ghost.p3':'добивает слабейшего','bot.admiral.name':'Адмирал','bot.admiral.summary':'Всё сразу: флоты Монте-Карло, точный перебор, как только позиция становится небольшой, точный expectimax эндшпиля, оружие по ожидаемой выгоде и расстановка, которую упускают охотники по плотности.','bot.admiral.p1':'точные эндшпили','bot.admiral.p2':'оружие по ожидаемой выгоде','bot.admiral.p3':'непредсказуемая расстановка','method.random':'Случайные выстрелы','method.random.d':'Стреляет наугад; добивает попадание лишь так часто, как велит его дисциплина.','method.hunt':'Поиск и добивание','method.hunt.d':'Ищет наугад, затем стреляет вокруг попадания и вдоль линии двух попаданий.','method.parity':'Шахматный поиск','method.parity.d':'Ищет только по одному цвету шахматной доски с шагом самого маленького уцелевшего корабля, затем добивает.','method.density':'Плотность расстановок','method.density.d':'Считает, сколько расстановок каждого уцелевшего корабля проходит через каждую клетку, и стреляет туда, где их больше всего.','method.montecarlo':'Флоты Монте-Карло','method.montecarlo.d':'Генерирует целые флоты, согласные со всем известным, и стреляет в клетку, где корабль вероятнее всего.','method.information':'Максимум информации','method.information.d':'Генерирует флоты и стреляет туда, где ответ, как ожидается, научит больше всего (энтропия в битах).','method.solver':'Решатель','method.solver.d':'Монте-Карло, точный перебор, как только позиция становится небольшой, и точный expectimax эндшпиля.','tg.best':'лучший шанс где угодно','tg.weakest':'самый слабый флот','tg.leader':'самый сильный флот','tg.random':'кого угодно наугад','tg.revenge':'того, кто стрелял по нему последним','t 6 × 6 з трипалубним, двопалубним і двома однопалубними.','preset.fog.name':'Туман війни','preset.fog.desc':'Класичний флот, але відповідь лише «влучив» або «мимо»: ніхто не каже, коли корабель потоплено, і вода не позначається. Решту виводьте самі.','preset.armada-14.name':'Армада 14 × 14','preset.armada-14.desc':'Море 14 × 14 і тринадцять кораблів від авіаносця до трьох катерів; кораблі можуть торкатися кутами. Довге полювання.','preset.ocean-20.name':'Океан 20 × 20','preset.ocean-20.desc':'Відкритий океан: 20 × 20 клітинок і п’ятнадцять кораблів від шестипалубного танкера до п’яти есмінців, стрільба залпами по пострілу за кожен уцілілий корабель.','preset.ffa.name':'Усі проти всіх','preset.ffa.desc':'Три або чотири адмірали, усі проти всіх: щоходу вибирайте, по чиєму морю стріляти. Влучання дає ще один постріл; перемагає останній уцілілий флот.','preset.teams.name':'Двоє на двоє','preset.teams.desc':'Дві команди по два флоти; партнери сидять один навпроти одного й стріляють лише по іншій команді. Команда програє, коли потоплено обидва її флоти.','preset.ex-archipelago.name':'Архіпелаг','preset.ex-archipelago.desc':'Ексклюзив. Море 12 × 10 з тринадцятьма островами, на яких не може стояти корабель: острови відомі всім і викривлюють імовірності навколо себе. Флот Battleship, кути можуть торкатися, влучання дає ще один постріл.','preset.ex-tetromino.name':'Флот тетроміно','preset.ex-tetromino.desc':'Ексклюзив. Кораблі — поліміно: пряма четвірка, L, T, S, квадрат і два буксири-кутики. Їх можна повертати й віддзеркалювати, вони ніколи не торкаються, потоплений корабель показують — але влучання більше не каже, куди йде корпус.','preset.ex-arsenal.name':'Арсенал','preset.ex-arsenal.desc':'Ексклюзив. Класична гра зі зброєю: два сканування радаром (скільки клітинок кораблів сховано в квадраті 3 × 3), один авіаудар уздовж чотирьох клітинок рядка або стовпця, одна касетна бомба на хрест із п’яти клітинок — і дві міни у вашому морі: хто влучить у міну, отримає такий самий постріл по своєму полю.','preset.ex-sonar.name':'Глибокий сонар','preset.ex-sonar.desc':'Ексклюзив. Море 12 × 12 у тумані: лише «влучив» або «мимо», про потоплення не оголошують — зате є три сканування сонаром 3 × 3. Інформація — це зброя.','tag.classic':'Класика','tag.small':'Маленьке','tag.big':'Велике море','tag.salvo':'Залпи','tag.secret':'Таємні потоплення','tag.party':'Компанія','tag.teams':'Команди','tag.exclusive':'Ексклюзив','tag.islands':'Острови','tag.shapes':'Форми','tag.weapons':'Зброя','setup.title':'Нова гра','setup.rules':'Правила','setup.all':'Усі','setup.own':'Мої','setup.noOwn':'Власних правил поки немає — створіть їх у конструкторі.','setup.meta':'{w} × {h} · кораблів: {ships} · гравців: {min}–{max}','setup.howPlay':'Як грається {name}','setup.players':'Гравці','setup.fewer':'Менше гравців','setup.more':'Більше гравців','setup.seatsHint':'Натисніть на суперника, щоб вибрати іншого бота, його рівень або власного бота.','setup.shuffle':'Боти й перший стрілець','setup.prng':'Зерно (можна поділитися)','setup.csprng':'Надійний випадок','setup.seed':'Зерно','setup.seedAuto':'нове зерно в кожній грі','setup.newSeed':'Нове зерно','setup.prngHint':'Зерно повторює ті самі флоти ботів, рішення ботів і першого стрільця: поділіться ним, щоб порівняти, як ви граєте той самий бій.','setup.csprngHint':'Криптографічне джерело випадковості браузера: ніхто не зможе передбачити або повторити гру.','setup.start':'Розставити флот','lvl.1':'Легкий','lvl.2':'Звичайний','lvl.3':'Складний','lvl.4':'Експерт','bp.title':'Виберіть суперника','bp.mode':'Вибір бота','bp.templates':'Характери','bp.build':'Зібрати бота','bp.level':'Рівень','bp.rating':'Рейтинг на цьому рівні (за симуляціями)','bp.beats':'Перемагає:','bp.loses':'Програє:','bp.similar':'Схожий на: {name}','bp.delete':'Видалити цього бота','bp.myBot':'Мій бот','bp.name':'Ім’я','bp.icon':'Значок','bp.base':'Почати з','bp.method':'Стрільба','bp.placement':'Розстановка','bp.targeting':'По кому стріляє','bp.traits':'Риси', ssisch','preset.classic.desc':'Das Schulspiel auf Kästchenpapier: ein 10 × 10-Meer, ein Vierer, zwei Dreier, drei Zweier und vier Einer. Schiffe berühren sich nie, nicht einmal an den Ecken. Ein Treffer bringt einen weiteren Schuss; ein versenktes Schiff wird gezeigt und das Wasser darum markiert.','preset.hasbro.name':'Battleship','preset.hasbro.desc':'Die Brettspielregeln: fünf Schiffe vom Flugzeugträger (5) bis zum Zerstörer (2), Schiffe dürfen sich berühren, die Züge wechseln Schuss um Schuss. Ein Versenken wird mit dem Schiffstyp angesagt („Du hast mein Schlachtschiff versenkt!“), aber seine Felder werden nicht gezeigt.','preset.salvo.name':'Salve','preset.salvo.desc':'Jeder Zug feuert einen Schuss pro schwimmendem Schiff, alle auf einmal — wer Schiffe verliert, verliert Feuerkraft. Die Battleship-Flotte, Schiffe dürfen sich berühren, Versenkungen werden mit dem Typ angesagt.','preset.volley.name':'Dreierschuss','preset.volley.desc':'Drei Schüsse jeden Zug, egal was mit der Flotte geschieht. Schiffe dürfen sich nur an den Ecken berühren; versenkte Schiffe werden gezeigt.','preset.quick-8.name':'Schnell 8 × 8','preset.quick-8.desc':'Ein kurzes Spiel auf einem 8 × 8-Meer: ein Dreier, zwei Zweier und zwei Einer; klassische Regeln.','preset.mini-6.name':'Mini 6 × 6','preset.mini-6.desc':'Ein Zwei-Minuten-Spiel fürs Handy: ein 6 × 6-Meer mit einem Dreier, einem Zweier und zwei Einern.','preset.fog.name':'Nebel des Krieges','preset.fog.desc':'Die klassische Flotte, aber die Antwort ist nur „Treffer“ oder „Wasser“: Niemand sagt, wann ein Schiff sinkt, und kein Wasser wird markiert. Den Rest musst du selbst erschließen.','preset.armada-14.name':'Armada 14 × 14','preset.armada-14.desc':'Ein 14 × 14-Meer und dreizehn Schiffe vom Flugzeugträger bis zu drei Booten; Schiffe dürfen sich an den Ecken berühren. Eine lange Jagd.','preset.ocean-20.name':'Ozean 20 × 20','preset.ocean-20.desc':'Der offene Ozean: 20 × 20 Felder und fünfzehn Schiffe vom Sechser-Tanker bis zu fünf Zerstörern, beschossen in Salven aus einem Schuss pro schwimmendem Schiff.','preset.ffa.name':'Jeder gegen jeden','preset.ffa.desc':'Drei oder vier Admirale, jeder gegen jeden: wähle jeden Zug, auf wessen Meer du schießt. Ein Treffer bringt einen weiteren Schuss; die letzte schwimmende Flotte gewinnt.','preset.teams.name':'Zwei gegen zwei','preset.teams.desc':'Zwei Teams aus je zwei Flotten; Partner sitzen sich gegenüber und schießen nur auf das andere Team. Ein Team verliert, wenn seine beiden Flotten versenkt sind.','preset.ex-archipelago.name':'Archipel','preset.ex-archipelago.desc':'Exklusiv. Ein 12 × 10-Meer mit dreizehn Inseln, auf denen kein Schiff liegen kann: Die Inseln kennt jeder, und sie verbiegen die Wahrscheinlichkeiten um sich herum. Die Battleship-Flotte, Ecken dürfen sich berühren, ein Treffer bringt einen weiteren Schuss.','preset.ex-tetromino.name':'Tetromino-Flotte','preset.ex-tetromino.desc':'Exklusiv. Schiffe sind Polyominos: eine gerade Vier, ein L, ein T, ein S, ein Quadrat und zwei Eck-Schlepper. Sie dürfen gedreht und gespiegelt werden, berühren sich nie, und ein versenktes Schiff wird gezeigt — aber ein Treffer verrät nicht mehr, in welche Richtung der Rumpf verläuft.','preset.ex-arsenal.name':'Arsenal','preset.ex-arsenal.desc':'Exklusiv. Das klassische Spiel mit Waffen: zwei Radarscans (wie viele Schiffsfelder sich in einem 3 × 3-Quadrat verstecken), ein Luftangriff entlang von vier Feldern einer Zeile oder Spalte, eine Streubombe auf ein Kreuz aus fünf Feldern — und zwei Minen in deinem Meer: Wer eine trifft, bekommt denselben Schuss auf sein eigenes Brett.','preset.ex-sonar.name':'Tiefensonar','preset.ex-sonar.desc':'Exklusiv. Ein 12 × 12-Meer im Nebel: nur „Treffer“ oder „Wasser“, keine Versenkungen angesagt — aber drei Sonarscans von je 3 × 3. Information ist die Waffe.','tag.classic':'Klassisch','tag.small':'Klein','tag.big':'Großes Meer','tag.salvo':'Salven','tag.secret':'Geheime Versenkungen','tag.party':'Party','tag.teams':'Teams',' rt seine Waffen sofort.','bot.rookie.p1':'zufällige Schüsse','bot.rookie.p2':'naive Verfolgung von Treffern','bot.rookie.p3':'schnelle Aufstellung','bot.hunter.name':'Jäger','bot.hunter.summary':'Die Lehrbuch-Jagd: sucht auf einem Schachbrettmuster im Abstand des kleinsten noch schwimmenden Schiffs, erledigt jedes angeschossene Schiff entlang seiner Linie und geht auf die schwächste Flotte los.','bot.hunter.p1':'Schachbrettsuche','bot.hunter.p2':'erledigt angeschossene Schiffe','bot.hunter.p3':'setzt den Schwächsten zu','bot.cartographer.name':'Kartograf','bot.cartographer.summary':'Zählt jede Lage, die die übrigen Schiffe noch haben könnten, und schießt dorthin, wo sich die meisten kreuzen; verteilt die eigenen Schiffe gleichmäßig über das Meer.','bot.cartographer.p1':'Aufstellungsdichte','bot.cartographer.p2':'verteilte Flotte','bot.cartographer.p3':'die beste Chance überall','bot.statistician.name':'Statistiker','bot.statistician.summary':'Zieht ganze Flotten, die zu allem Gesehenen passen, und schießt auf das Feld, das am wahrscheinlichsten ein Schiff enthält; versteckt die eigene Flotte gleichverteilt zufällig, was keine Vorannahme ausnutzen kann.','bot.statistician.p1':'Monte-Carlo-Flotten','bot.statistician.p2':'das wahrscheinlichste Feld','bot.statistician.p3':'eine unausnutzbare Aufstellung','bot.scholar.name':'Gelehrter','bot.scholar.summary':'Stellt die Fragen, deren Antworten ihn am meisten lehren: maximiert die erwartete Information jedes Schusses, liebt Radarscans und hält seine Schiffe von den Rändern fern.','bot.scholar.p1':'maximale Information','bot.scholar.p2':'Radar zuerst','bot.scholar.p3':'Schiffe auf offener See','bot.corsair.name':'Korsar','bot.corsair.summary':'Drückt die eigenen Schiffe an die Küsten und erwartet von allen anderen dasselbe: sucht zuerst die Ränder ab, greift die stärkste Flotte an und feuert seine Waffen früh.','bot.corsair.p1':'Schiffe entlang der Ränder','bot.corsair.p2':'sucht zuerst die Ränder ab','bot.corsair.p3':'grei lassiques.','preset.mini-6.name':'Mini 6 × 6','preset.mini-6.desc':'Une partie de deux minutes pour téléphone : une mer de 6 × 6 avec un navire de trois cases, un de deux et deux d’une case.','preset.fog.name':'Brouillard de guerre','preset.fog.desc':'La flotte classique, mais la réponse n’est que « touché » ou « à l’eau » : personne ne dit quand un navire coule, et aucune eau n’est marquée. Déduisez le reste vous-même.','preset.armada-14.name':'Armada 14 × 14','preset.armada-14.desc':'Une mer de 14 × 14 et treize navires, d’un porte-avions à trois bateaux ; les navires peuvent se toucher par les coins. Une longue chasse.','preset.ocean-20.name':'Océan 20 × 20','preset.ocean-20.desc':'L’océan ouvert : 20 × 20 cases et quinze navires, d’un pétrolier de six à cinq destroyers, pris pour cible en salves d’un tir par navire à flot.','preset.ffa.name':'Chacun pour soi','preset.ffa.desc':'Trois ou quatre amiraux, chacun contre tous : choisissez à chaque tour sur quelle mer tirer. Un tir touché donne un tir de plus ; la dernière flotte à flot gagne.','preset.teams.name':'Deux contre deux','preset.teams.desc':'Deux équipes de deux flottes chacune ; les partenaires sont assis face à face et ne tirent que sur l’autre équipe. Une équipe perd quand ses deux flottes sont coulées.','preset.ex-archipelago.name':'Archipel','preset.ex-archipelago.desc':'Exclusif. Une mer de 12 × 10 avec treize îles où aucun navire ne peut se trouver : tout le monde connaît les îles, et elles faussent les probabilités autour d’elles. La flotte de Battleship, les coins peuvent se toucher, un tir touché donne un tir de plus.','preset.ex-tetromino.name':'Flotte tétromino','preset.ex-tetromino.desc':'Exclusif. Les navires sont des polyominos : un quatre droit, un L, un T, un S, un carré et deux remorqueurs en coin. Ils peuvent être tournés et retournés, ne se touchent jamais, et un navire coulé est montré — mais un tir touché ne dit plus dans quel sens va la coque.','preset.ex-arsenal.name':'Arsenal','preset.ex-arsenal.desc':'Exclusif. Le jeu classique avec des armes : deux sondages radar (combien de cases de navire se cachent dans un carré de 3 × 3), une frappe aérienne sur quatre cases d’une ligne ou d’une colonne, une bombe à fragmentation sur une croix de cinq cases — et deux mines dans votre mer : qui en touche une reçoit le même tir sur son propre plateau.','preset.ex-sonar.name':'Sonar profond','preset.ex-sonar.desc':'Exclusif. Une mer de 12 × 12 dans le brouillard : seulement « touché » ou « à l’eau », aucun naufrage annoncé — mais trois sondages sonar de 3 × 3 chacun. L’information est l’arme.','tag.classic':'Classique','tag.small':'Petit','tag.big':'Grande mer','tag.salvo':'Salves','tag.secret':'Naufrages secrets','tag.party':'Fête','tag.teams':'Équipes','tag.exclusive':'Exclusif','tag.islands':'Îles','tag.shapes':'Formes','tag.weapons':'Armes','setup.title':'Nouvelle partie','setup.rules':'Règles','setup.all':'Toutes','setup.own':'Les miennes','setup.noOwn':'Pas encore de règles à vous — créez-en dans le constructeur.','setup.meta':'{w} × {h} · {ships} navires · {min}–{max} joueurs','setup.howPlay':'Comment se joue {name}','setup.players':'Joueurs','setup.fewer':'Moins de joueurs','setup.more':'Plus de joueurs','setup.seatsHint':'Touchez un adversaire pour choisir un autre bot, son niveau ou un bot à vous.','setup.shuffle':'Les bots et le premier tireur','setup.prng':'Graine (partageable)','setup.csprng':'Hasard sécurisé','setup.seed':'Graine','setup.seedAuto':'une nouvelle graine à chaque partie','setup.newSeed':'Nouvelle graine','setup.prngHint':'Une graine rejoue les mêmes flottes des bots, les mêmes décisions des bots et le même premier tireur : partagez-la pour comparer comment vous jouez la même bataille.','setup.csprngHint':'La source de hasard cryptographique du navigateur : personne ne peut prévoir ni répéter la partie.','setup.start':'Placer la flotte','lvl.1':'Facile','lvl.2':'Normal','lvl.3':'Difficile','lvl.4':'Expert','bp.title':'Choisissez  los barcos pueden tocarse y los turnos se alternan disparo a disparo. Un hundimiento se anuncia con el tipo de barco (“¡has hundido mi acorazado!”), pero sus casillas no se muestran.','preset.salvo.name':'Salva','preset.salvo.desc':'Cada turno se dispara un tiro por cada barco aún a flote, todos a la vez — perder barcos es perder potencia de fuego. La flota de Battleship, los barcos pueden tocarse y los hundimientos se anuncian con el tipo.','preset.volley.name':'Andanada de tres','preset.volley.desc':'Tres disparos cada turno, pase lo que pase con la flota. Los barcos solo pueden tocarse por las esquinas; los barcos hundidos se muestran.','preset.quick-8.name':'Rápido 8 × 8','preset.quick-8.desc':'Una partida corta en un mar de 8 × 8: un barco de tres casillas, dos de dos y dos de una; reglas clásicas.','preset.mini-6.name':'Mini 6 × 6','preset.mini-6.desc':'Una partida de dos minutos para el móvil: un mar de 6 × 6 con un barco de tres casillas, uno de dos y dos de una.','preset.fog.name':'Niebla de guerra','preset.fog.desc':'La flota clásica, pero la respuesta es solo “tocado” o “agua”: nadie dice cuándo se hunde un barco y no se marca el agua. Deduce el resto tú mismo.','preset.armada-14.name':'Armada 14 × 14','preset.armada-14.desc':'Un mar de 14 × 14 y trece barcos, desde un portaaviones hasta tres botes; los barcos pueden tocarse por las esquinas. Una caza larga.','preset.ocean-20.name':'Océano 20 × 20','preset.ocean-20.desc':'El océano abierto: 20 × 20 casillas y quince barcos, desde un petrolero de seis hasta cinco destructores, atacados con salvas de un disparo por barco a flote.','preset.ffa.name':'Todos contra todos','preset.ffa.desc':'Tres o cuatro almirantes, todos contra todos: elige a qué mar disparar en cada turno. Un tocado da otro disparo; gana la última flota a flote.','preset.teams.name':'Dos contra dos','preset.teams.desc':'Dos equipos de dos flotas cada uno; los compañeros se sientan uno frente al otro y solo disparan al otro equipo. Un equipo pierde cuando sus dos flotas están hundidas.','preset.ex-archipelago.name':'Archipiélago','preset.ex-archipelago.desc':'Exclusivo. Un mar de 12 × 10 con trece islas donde no puede haber barcos: todos conocen las islas y estas tuercen las probabilidades a su alrededor. La flota de Battleship, se puede tocar por las esquinas, un tocado da otro disparo.','preset.ex-tetromino.name':'Flota tetrominó','preset.ex-tetromino.desc':'Exclusivo. Los barcos son poliominós: un recto de cuatro, una L, una T, una S, un cuadrado y dos remolcadores en esquina. Se pueden girar y reflejar, nunca se tocan, y un barco hundido se muestra — pero un tocado ya no te dice hacia dónde va el casco.','preset.ex-arsenal.name':'Arsenal','preset.ex-arsenal.desc':'Exclusivo. El juego clásico con armas: dos exploraciones de radar (cuántas casillas de barco se esconden en un cuadrado de 3 × 3), un ataque aéreo a lo largo de cuatro casillas de una fila o una columna, una bomba de racimo sobre una cruz de cinco casillas — y dos minas en tu mar: quien toque una recibe el mismo disparo en su propio tablero.','preset.ex-sonar.name':'Sonar profundo','preset.ex-sonar.desc':'Exclusivo. Un mar de 12 × 12 en la niebla: solo “tocado” o “agua”, sin anunciar hundimientos — pero con tres exploraciones de sonar de 3 × 3 cada una. La información es el arma.','tag.classic':'Clásico','tag.small':'Pequeño','tag.big':'Mar grande','tag.salvo':'Salvas','tag.secret':'Hundimientos secretos','tag.party':'Grupo','tag.teams':'Equipos','tag.exclusive':'Exclusivo','tag.islands':'Islas','tag.shapes':'Formas','tag.weapons':'Armas','setup.title':'Nueva partida','setup.rules':'Reglas','setup.all':'Todas','setup.own':'Mías','setup.noOwn':'Todavía no tienes reglas propias — crea unas en el constructor.','setup.meta':'{w} × {h} · {ships} barcos · {min}–{max} jugadores','setup.howPlay':'Cómo se juega {name}','setup.players':'Jugadores','setup.fewer':'Menos jugadores','setup.more':'Más jugadores','setup.seatsHint':'Toca un rival para ele
