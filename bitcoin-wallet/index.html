<!doctype html>
<!-- bitcoin-wallet/index.html - Bitcoin wallet, explorer and dashboard in one page. An empty shell: main.js builds
     every section into <main>. No page registry anchors: the sections are tabs inside one page, not separate pages.
     Build (singlefile.js) strips these comments. -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: the bottom tab bar of walletui extends under the iPhone home indicator; wallet.css pads it
     with env(safe-area-inset-bottom). Without cover, those insets are 0. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitcoin Wallet</title>
<meta name="description" content="Bitcoin wallet, block explorer and dashboard: HD wallets (BIP-39, BIP-44/49/84/86), watch-only xpubs and descriptors, PSBT signing for air-gapped devices, coin control, RBF and CPFP, BIP-322 messages. Keys never leave the browser.">
<!-- color-scheme tells the UA to render form controls and scrollbars in the matching theme before CSS loads. -->
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7931a">
<!-- Favicon as an SVG data: URI (the Bitcoin B on an orange disc): no request, works offline. %23 = '#'. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f7931a'/%3E%3Cpath d='M12 8v2M15 8v2M12 22v2M15 22v2M10 10h6.5a3 3 0 0 1 0 6H10h7.5a3 3 0 0 1 0 6H10M11.5 10v12' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- Cascade order is a contract: tokens (ed-), shell (ap-), shared wallet components (wu-), then the Bitcoin accent,
     which overrides tokens defined in the first sheet and therefore must load last. -->
<link rel="stylesheet" href="../ui/base.css">
<link rel="stylesheet" href="../ui/app.css">
<link rel="stylesheet" href="../walletui/wallet.css">
<link rel="stylesheet" href="./app.css">
</head>
<body class="ap">
<main class="ap-main" id="main"></main>
<!-- noscript after main: a wallet cannot work without JS (all crypto is client-side), so state it plainly. -->
<noscript><div class="ed-noscript">The Bitcoin wallet needs JavaScript.</div></noscript>
<!-- Module script: deferred, strict mode, ES imports. Keys never leave the page; there is no server-side signing. -->
<script type="module" src="./main.js"></script>
</body>
</html>
