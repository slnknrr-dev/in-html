had ever wanted to buy.'),p('The village of Saltmarsh did not need forty clocks. It had the tide',note('n1','1'),', which came and went with a punctuality that put the church bell to shame, and it had the lighthouse, whose lamp was lit at dusk by a keeper who had not missed a single evening in twenty-two years.'),p('So Elias repaired more than he sold. Fishermen brought him pocket watches swollen with sea water; children brought him clockwork mice with broken springs. He fixed them all, slowly and ',em('without ever promising a day'),', because he believed that a promise about time was the one kind of promise a clockmaker should never make.'),p('On the morning this story begins, the tin alarm clock was running backwards.'),{type:'hr'},p('It was not broken. Elias opened its back, held it to the window and watched the escapement tick as neatly as ever. The wheels turned the right way. Only the hands moved the wrong way round, sliding from seven to six to five with an air of calm determination.'),p('“Well,” he said to it, “',strong('that'),' is new.”'),p('Then the bell above the door rang, and the postman came in out of the wind with a letter in his hand and an apology on his face.'),],},{id:'ch-2',title:[['Chapter 2'],['A Letter from the Sea']],sections:[],blocks:[{type:'epigraph',blocks:[p('Write it down, and the sea will deliver it. Eventually.')],authors:[['Margin note in a harbour log']]},p('“Found it behind the sorting cabinet,” the postman said. “They moved the cabinet for the first time since the flood. The stamp says it was posted in nineteen ninety-six.”'),p('The envelope was the colour of weak tea. The handwriting on it was small and slanted and very familiar, although Elias needed a long moment to admit to himself whose it was.'),p('He did not open it at once. He made tea, he wound the tall case clock a second time without noticing, and he looked at the tide table pinned beside the counter as if it could tell him what to do.'),{type:'table',id:'tides',rows: ull,subtitle:[],lines:[['So wind your watch and wait your turn,'],['the sea is never early;'],['what leaves the harbour will return'],['— if late, then all the surely.']]},],authors:[['Traditional, Saltmarsh']],date:''},p('“Your sister sang it wrong,” Ottilie said suddenly. “Always the last line. ',em('If late, then all the surely'),'. Nobody else says it like that.”'),p('Elias went very still. On the windowsill, among the spare lamp chimneys, sat a second tin alarm clock — the twin of his own. Its hands pointed at seven, and they were moving forwards.'),p('Taped to its back was a key, and a list in the same small, slanted hand:'),{type:'list',ordered:true,items:[[p('Wind the clock in the shop until the hands meet.')],[p('Bring this one down to the breakwater.')],[p('Say you are sorry first. I will, too.')]]},p('He laughed then, for the first time in a long while, because it was exactly like Maren to leave instructions for an apology',note('n3','3'),'.'),],},],},{id:'afterword',title:[['Afterword']],sections:[],blocks:[p('This sample book exists so that the reader and the writer of this application have something to show. It also contains a little code, because books about clocks should explain how clocks are wound:'),{type:'code',text:'for (const clock of shop.clocks) {\n  clock.wind(clock.turnsNeeded());\n}'},p('The chemistry of brass is CuZn',{t:'sub',c:['x']},', more or less; the tide repeats every 12',{t:'sup',c:['h']},' 25',{t:'sup',c:['m']},'. Read more about the ',{t:'a',href:'#tides',c:['tide table']},' or return to ',{t:'a',href:'#ch-1',c:['the first chapter']},'.'),p({t:'strike',c:['The end.']},' Not quite the end: the clocks are still running.'),],},],notes:[{id:'n1',kind:'note',label:['1'],blocks:[p('High water at Saltmarsh comes about fifty minutes later each day, following the moon.')]},{id:'n2',kind:'note',label:['2'],blocks:[p('Elias kept a ledger of every promise he had ever refused to make. This would have been the first entry on the other side of
