eer.p2':'positional flow','bot.puppeteer.p3':'sets neighbours against a target','bot.hunter.name':'Hunter','bot.hunter.summary':'Targets the leader: piles throw-ins on whoever is closest to getting out, so that nobody escapes early and the table stays crowded.','bot.hunter.p1':'targets the leader','bot.hunter.p2':'heavy throw-ins on short hands','bot.hunter.p3':'keeps the field full','bot.vulture.name':'Vulture','bot.vulture.summary':'Cements the weakest player as the durak: saves its pressure for whoever already holds the most cards and avoids fights with strong players.','bot.vulture.p1':'targets the weakest','bot.vulture.p2':'patient defence','bot.vulture.p3':'avoids the strong','bot.gambler.name':'Gambler','bot.gambler.summary':'Loves risk: transfers at every chance, beats with high cards, bluffs with unexpected leads. Hard to read, swingy results.','bot.gambler.p1':'risk appetite','bot.gambler.p2':'transfer chains','bot.gambler.p3':'unpredictable','bot.ally.name':'Ally','bot.ally.summary':'A team player: weighs every move by what it does for its partner (or, without teams, for the player who will otherwise attack it next); shields partners, presses their attackers.','bot.ally.p1':'cooperation','bot.ally.p2':'positional flow','bot.ally.p3':'protects partners','bot.grandmaster.name':'Grandmaster','bot.grandmaster.summary':'Everything at once: exact counting, inference, deal speculation, Monte-Carlo lookahead on every close decision and exact endgame search.','bot.grandmaster.p1':'all skills','bot.grandmaster.p2':'lookahead on close decisions','bot.grandmaster.p3':'exact endgame','preset.podkidnoy-36.name':'Podkidnoy','preset.podkidnoy-36.desc':'The classic throw-in durak: 36 cards, six in hand, the bottom card names the trump; everybody may throw in cards of the ranks on the table; at most five cards in the first bout and six later.','preset.perevodnoy-36.name':'Perevodnoy','preset.perevodnoy-36.desc':'Transfer durak: before beating anything the defender may pass ing.name':'Ring','preset.ex-ring.desc':'Exclusive. The ranks close into a ring: a six beats the ace of its suit, and that ace cannot beat it. Sixes and nines are mirror images and count as one rank for throw-ins and transfers.','preset.ex-chameleon.name':'Chameleon','preset.ex-chameleon.desc':'Exclusive. 36 cards and two colour jokers; every jack is a chameleon of its suit — it counts as any rank of its suit for throw-ins and transfers. Long transfer chains and colourful throw-ins.','preset.ex-bazaar.name':'Bazaar 114','preset.ex-bazaar.desc':'Exclusive. 114 cards: two 52-card decks, four colour jokers and six gold specials. The Crown is the highest trump of all (only jokers resist it); the Shield beats any plain card and closes the bout; the Fool fits every rank for throw-ins and transfers but is beaten by anything and cannot defend. Eight cards in hand, the lowest trump may take the open trump, neighbours throw in.','rl.deck':'{n} cards, {hand} in hand.','rl.copies':'Some cards exist more than once (mixed decks).','rl.custom':'Special cards: {cards}.','rl.trumpBottom':'The bottom card of the stock lies open and names the trump suit.','rl.trumpRandom':'A random suit is the trump; no card is shown.','rl.trumpNone':'No trump suit.','rl.trumpFixed':'The trump is always {suit}.','rl.eternal':'Eternal trump above the drawn one: {suits}.','rl.exchange':'The holder of the lowest trump may swap it for the open trump card.','rl.first.lowestTrump':'The player with the lowest trump attacks first.','rl.first.random':'A random player attacks first.','rl.first.seat0':'The first seat attacks first.','rl.throw.all':'Everybody except the defender may throw in.','rl.throw.neighbors':'Only the defender\'s neighbours throw in.','rl.throw.attacker':'Only the attacker throws in.','rl.limits':'At most {first} cards in the first bout, {n} later.','rl.limit':'At most {n} cards per bout.','rl.noLimit':'No limit of cards per bout.','rl.byHand':'Never more unbeaten cards than the defender hol ','bot.blitz.p1':'агрессивно подкидывает','bot.blitz.p2':'не жалеет козырей','bot.blitz.p3':'темп важнее материала','bot.accountant.name':'Бухгалтер','bot.accountant.summary':'Считает каждую карту и вычисляет руки по поведению (кто взял, кто сказал «бито», кто чем отбился); ходит достоинствами, которых нет у отбивающегося, и точно разыгрывает эндшпиль.','bot.accountant.p1':'точный счёт карт','bot.accountant.p2':'байесовский вывод о руках','bot.accountant.p3':'точный эндшпиль','bot.puppeteer.name':'Кукловод','bot.puppeteer.summary':'Играет на добор: управляет тем, кто берёт, а кто отбивается, чтобы открытый козырь пришёл к нему в руку, а соседи сражались с его целью.','bot.puppeteer.p1':'игра на добор','bot.puppeteer.p2':'позиционный расчёт','bot.puppeteer.p3':'стравливает соседей с целью','bot.hunter.name':'Охотник','bot.hunter.summary':'Охотится на лидера: заваливает подкидными того, кто ближе всех к выходу, чтобы никто не вышел рано и за столом оставалось людно.','bot.hunter.p1':'охотится на лидера','bot.hunter.p2':'много подкидывает тем, у кого мало карт','bot.hunter.p3':'держит стол полным','bot.vulture.name':'Стервятник','bot.vulture.summary':'Закрепляет за слабейшим роль дурака: бережёт давление для того, у кого уже больше всех карт, и избегает схваток с сильными.','bot.vulture.p1':'бьёт по слабейшему','bot.vulture.p2':'терпеливая защита','bot.vulture.p3':'избегает сильных','bot.gambler.name':'Азартный','bot.gambler.summary':'Любит риск: переводит при каждой возможности, отбивается старшими картами, блефует неожиданными ходами. Его трудно прочитать, результаты скачут.','bot.gambler.p1':'тяга к риску','bot.gambler.p2':'цепочки переводов','bot.gambler.p3':'непредсказуем','bot.ally.name':'Союзник','bot.ally.summary':'Командный игрок: оценивает каждый ход по пользе для партнёра (а без команд — для того, кто иначе будет ходить под него следующим); прикрывает партнёров, давит на их атакующих.','bot.ally.p1':'сотрудничество','bot.ally.p2':'позиционный расчёт','bot.ally.p3':'защищает партнёров','bot.grandmaster.name':'Гроссмейстер','bot.grandmaster.summary':'Всё сразу: точный счёт, дедукция, игра на добор, просчёт Монте-Карло в каждом спорном решении и точный перебор в эндшпиле.','bot.grandmaster.p1':'все навыки','bot.grandmaster.p2':'просчёт в спорных решениях','bot.grandmaster.p3':'точный эндшпиль','preset.podkidnoy-36.name':'Подкидной','preset.podkidnoy-36.desc':'Классический подкидной дурак: 36 карт, по шесть на руках, нижняя карта колоды определяет козырь; подкидывать карты тех достоинств, что лежат на столе, могут все; за первый кон не больше пяти карт, дальше — шесть.','preset.perevodnoy-36.name':'Переводной','preset.perevodnoy-36.desc':'Переводной дурак: пока ничего не побито, отбивающийся может перевести атаку на следующего игрока, добавив карту того же достоинства.','preset.podkidnoy-52.name':'Подкидной 52','preset.podkidnoy-52.desc':'Подкидной дурак полной колодой в 52 карты, до восьми игроков; подкидывают только соседи отбивающегося.','preset.jokers-54.name':'Джокеры 54','preset.jokers-54.desc':'52 карты и два цветовых джокера в переводном дураке. Джокер бьёт только карты своего цвета и бьётся только своим цветом; к нему можно подкинуть любую карту его цвета, а его — к любой карте его цвета; среди карт одного достоинства он считается этим достоинством, поэтому им можно переводить, и джокеры никогда не нарушают однородность перевода.','preset.double-72.name':'Двойная колода','preset.double-72.desc':'Две колоды по 36 карт, перетасованные вместе: каждая карта есть дважды. Для больших столов на четыре–восемь игроков.','preset.teams-36.name':'Команды 2×2','preset.teams-36.desc':'Две команды играют в подкидного дурака; партнёры сидят друг напротив друга, никогда не ходят друг под друга и не подкидывают друг другу. Проигрывает команда того, у кого последним остались карты.','preset.pogony-36.name':'С погонами','preset.pogony-36.desc':'Подкидной дурак, где владелец младшего козыря может обменять его на открытый козырь, а дурак, проигравший на шестёрках, получает «погоны».','preset.blitz-24.name':'Блиц 24','preset.blitz-24.desc':'Короткая колода в 24 карты (от девяток до тузов), пять карт на руках и переводы: быстрые партии на двоих–четверых.','preset.ex-twins.name':'Близнецы','preset.ex-twins.desc':'Эксклюзив. Двойная колода по 36 карт, где карту бьёт только её точный близнец: вторая дама червей бьёт первую. Переводы разрешены, подкидывают только соседи отбивающегося, так что близнецы гоняются друг за другом по большому столу.','preset.ex-two-crowns.name':'Две короны','preset.ex-two-crowns.desc':'Эксклюзив. Черви — вечный козырь старше выпавшего (который никогда не бывает червями). Червями можно отбиваться и подкидывать, но нельзя ходить и переводить — вторая козырная масть, которая только защищает.','preset.ex-ring.name':'Кольцо','preset.ex-ring.desc':'Эксклюзив. Достоинства замыкаются в кольцо: шестёрка бьёт туза своей масти, а этот туз её не бьёт. Шестёрки и девятки — зеркальные отражения и считаются одним достоинством при подкидывании и переводе.','preset.ex-chameleon.name':'Хамелеон','preset.ex-chameleon.desc':'Эксклюзив. 36 карт и два цветовых джокера; каждый валет — хамелеон своей масти: при подкидывании и переводе он считается любым достоинством своей масти. Длинные цепочки переводов и пёстрые подкидывания.','preset.ex-bazaar.name':'Базар 114','preset.ex-bazaar.desc':'Эксклюзив. 114 карт: две колоды по 52 карты, четыре цветовых джокера и шесть золотых особых карт. Корона — старший козырь из всех (устоять перед ней могут только джокеры); Щит бьёт любую некозырную карту и завершает кон; Шут подходит к любому достоинству при подкидывании и переводе, но его бьёт что угодно и им нельзя отбиваться. Восемь карт на руках, младший козырь может забрать открытый козырь, подкидывают соседи.','rl.deck':'Карт: {n}, на руках по {hand}.','rl.copies':'Некоторые карты есть в нескольких экземплярах (смешанные колоды).','rl.custom':'Особые карты: {cards}.','rl.trumpBottom':'Нижняя карта колоды леж ає партнерів, тисне на їхніх нападників.','bot.ally.p1':'співпраця','bot.ally.p2':'позиційний розрахунок','bot.ally.p3':'захищає партнерів','bot.grandmaster.name':'Гросмейстер','bot.grandmaster.summary':'Усе одразу: точний рахунок, дедукція, гра на добір, прорахунок Монте-Карло в кожному спірному рішенні й точний перебір в ендшпілі.','bot.grandmaster.p1':'усі навички','bot.grandmaster.p2':'прорахунок у спірних рішеннях','bot.grandmaster.p3':'точний ендшпіль','preset.podkidnoy-36.name':'Підкидний','preset.podkidnoy-36.desc':'Класичний підкидний дурень: 36 карт, по шість на руках, нижня карта колоди визначає козир; підкидати карти тих рангів, що лежать на столі, можуть усі; за перший раунд не більше п’яти карт, далі — шість.','preset.perevodnoy-36.name':'Перевідний','preset.perevodnoy-36.desc':'Перевідний дурень: поки нічого не побито, захисник може перевести атаку на наступного гравця, додавши карту того ж рангу.','preset.podkidnoy-52.name':'Підкидний 52','preset.podkidnoy-52.desc':'Підкидний дурень повною колодою з 52 карт, до восьми гравців; підкидають лише сусіди захисника.','preset.jokers-54.name':'Джокери 54','preset.jokers-54.desc':'52 карти й два кольорові джокери в перевідному дурні. Джокер б’є лише карти свого кольору, і його б’є лише його колір; до нього можна підкинути будь-яку карту його кольору, а його — до будь-якої карти його кольору; серед карт одного рангу він вважається цим рангом, тож ним можна переводити, і джокери ніколи не порушують однорідності переводу.','preset.double-72.name':'Подвійна колода','preset.double-72.desc':'Дві колоди по 36 карт, перетасовані разом: кожна карта є двічі. Для великих столів на чотирьох–вісьмох гравців.','preset.teams-36.name':'Команди 2×2','preset.teams-36.desc':'Дві команди грають у підкидного дурня; партнери сидять одне навпроти одного, ніколи не ходять одне під одного й не підкидають одне одному. Програє команда того, у кого останнього лишилися карти.','preset.pogony-36.name':'З погонами','preset.pogony-36.desc':'Підкидний дурень, де власник наймолодшого козиря може обміняти його на відкритий козир, а дурень, що програв на шістках, отримує «погони».','preset.blitz-24.name':'Бліц 24','preset.blitz-24.desc':'Коротка колода з 24 карт (від дев’яток до тузів), п’ять карт на руках і переводи: швидкі партії на двох–чотирьох гравців.','preset.ex-twins.name':'Близнята','preset.ex-twins.desc':'Ексклюзив. Подвійна колода по 36 карт, де карту б’є лише її точний близнюк: друга чирвова дама б’є першу. Переводи дозволено, підкидають лише сусіди захисника, тож близнюки ганяються одне за одним великим столом.','preset.ex-two-crowns.name':'Дві корони','preset.ex-two-crowns.desc':'Ексклюзив. Чирви — вічний козир, старший за випалий (який ніколи не буває чирвовим). Чирвами можна відбиватися й підкидати, але не можна ходити й переводити — друга козирна масть, яка лише захищає.','preset.ex-ring.name':'Кільце','preset.ex-ring.desc':'Ексклюзив. Ранги замикаються в кільце: шістка б’є туза своєї масті, а цей туз її не б’є. Шістки й дев’ятки — дзеркальні відображення й вважаються одним рангом під час підкидання й переводу.','preset.ex-chameleon.name':'Хамелеон','preset.ex-chameleon.desc':'Ексклюзив. 36 карт і два кольорові джокери; кожен валет — хамелеон своєї масті: під час підкидання й переводу він вважається будь-яким рангом своєї масті. Довгі ланцюжки переводів і строкаті підкидання.','preset.ex-bazaar.name':'Базар 114','preset.ex-bazaar.desc':'Ексклюзив. 114 карт: дві колоди по 52 карти, чотири кольорові джокери й шість золотих особливих карт. Корона — найстарший козир з усіх (встояти проти неї можуть лише джокери); Щит б’є будь-яку некозирну карту й завершує раунд; Блазень підходить до будь-якого рангу під час підкидання й переводу, але його б’є будь-що, і ним не можна відбиватися. Вісім карт на руках, наймолодший козир може забрати відкритий козир, підкидають сусіди.','rl.deck':'Карт: {n}, на руках по {hand}.','rl.copies':'Деякі карти є в кількох примірниках (змішані колоди).','rl.custom':'Осо ry':'Hortet Trümpfe: nimmt billige Stapel früh auf, behält Asse und Trümpfe fürs Endspiel, zählt jede Karte.','bot.miser.p1':'Trümpfe sparen','bot.miser.p2':'strategisches Aufnehmen bei großem Talon','bot.miser.p3':'starkes Endspiel','bot.blitz.name':'Blitz','bot.blitz.summary':'Verheizt Trümpfe aggressiv: häuft Karten auf den Verteidiger, schlägt mit allem, schiebt weiter, wann immer es geht, und leert seine Hand, solange der Talon reicht.','bot.blitz.p1':'aggressives Nachlegen','bot.blitz.p2':'gibt Trümpfe großzügig aus','bot.blitz.p3':'Tempo vor Material','bot.accountant.name':'Buchhalter','bot.accountant.summary':'Zählt jede Karte und erschließt Hände aus dem Verhalten (wer aufnahm, wer passte, wer womit schlug); spielt Ränge aus, die dem Verteidiger fehlen, und spielt das Endspiel exakt.','bot.accountant.p1':'exaktes Kartenzählen','bot.accountant.p2':'Bayes-Schlüsse auf die Hände','bot.accountant.p3':'exaktes Endspiel','bot.puppeteer.name':'Puppenspieler','bot.puppeteer.summary':'Spekuliert aufs Nachziehen: lenkt, wer aufnimmt und wer abwehrt, damit die offene Trumpfkarte in seiner Hand landet und seine Nachbarn gegen sein Ziel kämpfen.','bot.puppeteer.p1':'Nachzieh-Spekulation','bot.puppeteer.p2':'Positionsfluss','bot.puppeteer.p3':'hetzt Nachbarn auf ein Ziel','bot.hunter.name':'Jäger','bot.hunter.summary':'Zielt auf den Führenden: legt bei dem nach, der am nächsten am Rausgehen ist, damit niemand früh entkommt und der Tisch voll bleibt.','bot.hunter.p1':'zielt auf den Führenden','bot.hunter.p2':'viel Nachlegen bei kleinen Händen','bot.hunter.p3':'hält das Feld voll','bot.vulture.name':'Geier','bot.vulture.summary':'Macht den Schwächsten zum Durak: spart seinen Druck für den, der schon die meisten Karten hält, und meidet Kämpfe mit starken Spielern.','bot.vulture.p1':'zielt auf den Schwächsten','bot.vulture.p2':'geduldige Verteidigung','bot.vulture.p3':'meidet die Starken','bot.gambler.name':'Spieler','bot.gambler.summary':'Liebt das Risiko: schiebt bei jeder schiebt also weiter, und Joker brechen nie die Gleichheit eines Weiterschiebens.','preset.double-72.name':'Doppeldeck','preset.double-72.desc':'Zwei 36er-Decks zusammengemischt: jede Karte gibt es zweimal. Für große Tische mit vier bis acht Spielern.','preset.teams-36.name':'Teams 2×2','preset.teams-36.desc':'Zwei Teams spielen Durak mit Nachlegen; Partner sitzen sich gegenüber, greifen sich nie an und legen nie beieinander nach. Das Team des letzten Spielers mit Karten verliert.','preset.pogony-36.name':'Mit Pogony','preset.pogony-36.desc':'Durak mit Nachlegen, bei dem der Besitzer des niedrigsten Trumpfs ihn gegen die offene Trumpfkarte tauschen darf, und ein Durak, der gegen Sechsen verliert, bekommt „Pogony“ — Epauletten.','preset.blitz-24.name':'Blitz 24','preset.blitz-24.desc':'Ein kurzes Blatt mit 24 Karten (Neunen bis Asse), fünf Karten auf der Hand und Weiterschieben: schnelle Partien für zwei bis vier Spieler.','preset.ex-twins.name':'Zwillinge','preset.ex-twins.desc':'Exklusiv. Ein doppeltes 36er-Deck, in dem eine Karte von ihrem genauen Zwilling geschlagen wird: die zweite Herz-Dame schlägt die erste. Weiterschieben ist erlaubt und nur die Nachbarn des Verteidigers legen nach, also jagen sich Zwillinge um einen großen Tisch.','preset.ex-two-crowns.name':'Zwei Kronen','preset.ex-two-crowns.desc':'Exklusiv. Herz ist ewiger Trumpf über dem gezogenen (der nie Herz ist). Herz darf verteidigen und nachgelegt werden, aber nie einen Angriff eröffnen oder weiterschieben — eine zweite Trumpffarbe, die nur schützt.','preset.ex-ring.name':'Ring','preset.ex-ring.desc':'Exklusiv. Die Ränge schließen sich zum Ring: eine Sechs schlägt das Ass ihrer Farbe, und dieses Ass kann sie nicht schlagen. Sechsen und Neunen sind Spiegelbilder und zählen beim Nachlegen und Weiterschieben als ein Rang.','preset.ex-chameleon.name':'Chamäleon','preset.ex-chameleon.desc':'Exklusiv. 36 Karten und zwei Farbton-Joker; jeder Bube ist ein Chamäleon seiner Farbe — er zählt beim Nachlegen und Weiterschieben als jeder Rang seiner Farbe. Lange Weiterschiebe-Ketten und buntes Nachlegen.','preset.ex-bazaar.name':'Basar 114','preset.ex-bazaar.desc':'Exklusiv. 114 Karten: zwei 52er-Decks, vier Farbton-Joker und sechs goldene Sonderkarten. Die Krone ist der höchste Trumpf von allen (nur Joker halten ihr stand); der Schild schlägt jede einfache Karte und beendet die Runde; der Narr passt beim Nachlegen und Weiterschieben zu jedem Rang, wird aber von allem geschlagen und kann nicht verteidigen. Acht Karten auf der Hand, der niedrigste Trumpf darf den offenen Trumpf nehmen, Nachbarn legen nach.','rl.deck':'{n} Karten, {hand} auf der Hand.','rl.copies':'Manche Karten gibt es mehrfach (gemischte Decks).','rl.custom':'Sonderkarten: {cards}.','rl.trumpBottom':'Die unterste Karte des Talons liegt offen und bestimmt die Trumpffarbe.','rl.trumpRandom':'Eine zufällige Farbe ist Trumpf; keine Karte wird gezeigt.','rl.trumpNone':'Keine Trumpffarbe.','rl.trumpFixed':'Trumpf ist immer {suit}.','rl.eternal':'Ewiger Trumpf über dem gezogenen: {suits}.','rl.exchange':'Wer den niedrigsten Trumpf hat, darf ihn gegen die offene Trumpfkarte tauschen.','rl.first.lowestTrump':'Wer den niedrigsten Trumpf hat, greift zuerst an.','rl.first.random':'Ein zufälliger Spieler greift zuerst an.','rl.first.seat0':'Der erste Platz greift zuerst an.','rl.throw.all':'Alle außer dem Verteidiger dürfen nachlegen.','rl.throw.neighbors':'Nur die Nachbarn des Verteidigers legen nach.','rl.throw.attacker':'Nur der Angreifer legt nach.','rl.limits':'Höchstens {first} Karten in der ersten Runde, danach {n}.','rl.limit':'Höchstens {n} Karten pro Runde.','rl.noLimit':'Keine Kartengrenze pro Runde.','rl.byHand':'Nie mehr ungeschlagene Karten, als der Verteidiger hält.','rl.multi':'Mehrere Karten eines Rangs dürfen zusammen ausgespielt werden.','rl.transfer':'Weiterschieben: bevor er etwas schlägt, darf der Verteidiger eine Karte gleichen Rangs dazulegen und den Angriff weitergeben.','rl.transferShow':'Weite
