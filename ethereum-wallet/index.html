<!doctype html>
<!-- ethereum-wallet/index.html: the single page of the wallet. An empty shell: main.js renders every section into
     <main> after the vault is unlocked. Why no static markup: the lock screen must be the first thing drawn, and every
     view depends on decrypted vault data that does not exist at parse time. The build (singlefile.js) inlines the
     module graph and strips these comments; the same HTML then serves the offline, serverless and backend artifacts. -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: lets the layout extend under display notches instead of letterboxing. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ethereum Wallet</title>
<meta name="description" content="Ethereum wallet, block explorer and dashboard for every EVM chain: HD wallets (BIP-39 / BIP-44, Ledger Live paths), private keys and keystore files, watch-only addresses, ETH and ERC-20 tokens, EIP-1559 fees, offline signing, EIP-191 / EIP-712 messages, contract calls. Keys never leave the browser.">
<!-- color-scheme: native controls and scrollbars follow the OS theme before any CSS loads (no white flash in dark
     mode). theme-color: Ethereum brand blue for the mobile browser chrome. -->
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#627eea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23627eea'/%3E%3Cpath d='M16 5v8.1l6.9 3.1z' fill='%23fff' fill-opacity='.6'/%3E%3Cpath d='M16 5 9.1 16.2l6.9-3.1z' fill='%23fff'/%3E%3Cpath d='M16 21.4V27l6.9-9.6z' fill='%23fff' fill-opacity='.6'/%3E%3Cpath d='M16 27v-5.6l-6.9-4z' fill='%23fff'/%3E%3Cpath d='m16 20.1 6.9-4-6.9-3.1z' fill='%23fff' fill-opacity='.2'/%3E%3Cpath d='m9.1 16.2 6.9 4V13z' fill='%23fff' fill-opacity='.6'/%3E%3C/svg%3E">
<!-- Cascade order is a contract: tokens/primitives (ed-), app shell (ap-), shared wallet UI (wu-, also used by the
     bitcoin wallet), then this app's accent and ew- rules. Later file wins ties, so overrides need no !important. -->
<link rel="stylesheet" href="../ui/base.css">
<link rel="stylesheet" href="../ui/app.css">
<link rel="stylesheet" href="../walletui/wallet.css">
<link rel="stylesheet" href="./app.css">
</head>
<body class="ap">
<!-- id="main": the one mount point main.js looks up; everything else is created in JS. -->
<main class="ap-main" id="main"></main>
<noscript><div class="ed-noscript">The Ethereum wallet needs JavaScript.</div></noscript>
<!-- type="module": deferred by default (DOM parsed when it runs), strict mode; imports resolve relative to this file,
     which is why the dev server serves the repository root. -->
<script type="module" src="./main.js"></script>
</body>
</html>
