<!doctype html>
<!-- icon-creator/index.html - Icon Creator, a pixel editor for application icons. A shell, not a document: main.js
     builds the toolbar, canvas and panels into <main>. Cost accepted: nothing without JS. The build strips every
     comment of this file. -->
<html lang="en">
<!-- lang="en" is the static default; ui/i18n.js rewrites it on language switch (screen readers, hyphenation). -->
<head>
<meta charset="utf-8">
<!-- charset first: it must sit in the first 1024 bytes, before any non-ASCII text, or the parser re-decodes. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Without viewport, phones lay out at ~980px and zoom out: the @media (max-width) rules of app.css never fire. -->
<title>Icon Creator</title>
<!-- description: shown by search engines and link previews; the published page is a standalone tool. -->
<meta name="description" content="Pixel editor for application icons: magic wand background removal, up to five hand-drawn sizes (32 to 256 px), export as .ico or .png. Works offline.">
<meta name="color-scheme" content="light dark">
<!-- color-scheme: native controls (scrollbars, the colour picker, form fields) follow the OS theme before and
     after CSS loads, so a dark-mode user gets no white flash in native widgets. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230ea5e9'/%3E%3Crect x='7' y='7' width='8' height='8' fill='%23fff'/%3E%3Crect x='17' y='7' width='8' height='8' fill='%23fde047'/%3E%3Crect x='7' y='17' width='8' height='8' fill='%23f472b6'/%3E%3Cpath d='M21 17v8M17 21h8' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<!-- Icon as a URL-encoded SVG data: URI: zero requests, works from file:// and offline builds. %23 for '#': a raw
     '#' would start a URL fragment and truncate the image. -->

<!-- Cascade order is a contract (equal specificity: the later file wins):
       1. ui/base.css  design tokens (ed- custom properties), reset, primitives (.ed-input, .ed-btn)
       2. ui/app.css   app shell (.ap-*: header, main, cards)
       3. ./app.css    this app, overrides 1-2 by order, not by weight -->
<link rel="stylesheet" href="../ui/base.css">
<link rel="stylesheet" href="../ui/app.css">
<link rel="stylesheet" href="./app.css">
</head>
<body class="ap">
<!-- .ap on body: root hook of the ui/app.css shell (flex column, footer pushed down). -->
<!-- Empty mount point: all UI is built by main.js. One render path (JS) for content, i18n and state; static markup
     would duplicate it and drift. <main> landmark lets assistive tech jump straight to content. -->
<main class="ap-main" id="main"></main>
<!-- type="module": deferred by spec (runs after parsing, so #main exists), strict mode, and native ../ imports in
     development; the build inlines every module into one file. -->
<script type="module" src="./main.js"></script>
</body>
</html>
