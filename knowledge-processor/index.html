<!doctype html>
<!-- knowledge-processor/index.html: the editor page. An empty shell: main.js builds the whole three-column editor
     and appends it to <body>. Why no static markup: one render path (JS) owns content, i18n and state; static
     markup would duplicate it and drift. The published reader is a different page generated by export.js. -->
<html lang="en">
<!-- lang="en" is only the static default; ui/i18n.js rewrites it on language switch. -->
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: on notched phones the page may extend under the safe areas; the bottom pane tab bar
     (editor.css .kp-ed-tabs) is the element that has to respect env(safe-area-inset-*). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- color-scheme: native controls, scrollbars and the pre-CSS canvas follow the OS theme, so dark users get no
     white flash before ui/base.css loads. -->
<meta name="color-scheme" content="light dark">
<title>Knowledge Processor</title>
<!-- description: shown by search engines and link previews; the editor itself is not meant to be indexed content. -->
<meta name="description" content="Knowledge base and wiki builder: pages with Wikipedia-like blocks (infoboxes, references, navboxes, timelines), annotated pictures with clickable regions, hover previews, versions of a page, toggleable layers for translations and transcription, password-encrypted 451 pages; published as one HTML file, a static site or a Node server.">
<!-- Icon as URL-encoded SVG data: URI: zero requests, works from file:// and in the single-file build.
     '#' is written %23, otherwise it would start a URL fragment and cut the URI. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M9 7h10l5 5v13H9z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M12 15h3v3h-3zM18 16.5h3M12 21h9' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- Cascade order is a contract: base tokens and primitives (ed-), then shell (ap-), then this app (kp-).
     Equal-specificity overrides in editor.css work only because it loads last. -->
<link rel="stylesheet" href="../ui/base.css">
<link rel="stylesheet" href="../ui/app.css">
<link rel="stylesheet" href="./editor.css">
</head>
<!-- .kp-body: app root hook; editor.css uses it to make the body a fixed-height flex column (no page scroll,
     each column scrolls on its own). -->
<body class="kp-body">
<!-- noscript: the only static content. Explains the dependency and the local-only storage promise. -->
<noscript><div class="ed-noscript">Knowledge Processor needs JavaScript. It runs in your browser; your knowledge bases stay on this device.</div></noscript>
<!-- type="module": deferred by spec (runs after parsing, body exists), strict mode, ES imports resolved by the
     browser in development and inlined by the bundler in builds. -->
<script type="module" src="./main.js"></script>
</body>
</html>
