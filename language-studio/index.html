<!doctype html>
<!-- language-studio/index.html - Language Studio page. A shell, not a document: main.js routes by location.hash
     (course, tab, section) and builds every view into <main>. One render path for content, i18n and progress;
     static markup would duplicate it and drift. The build (singlefile.js) inlines styles and modules into the html@5
     artifacts and strips these comments. -->
<html lang="en">
<!-- lang="en" is the UI default; ui/i18n.js rewrites it on a language switch. Course content carries its own lang
     attributes (ka, sa, ja, zh, ko, ru...), so fonts, line breaking and speech pick the right script per element. -->
<head>
<meta charset="utf-8">
<!-- charset first: within the first 1024 bytes, before any non-ASCII byte (the page is full of non-Latin scripts). -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Without the viewport meta, phones lay out at about 980px and no @media (max-width) rule would fire. -->
<title>Language Studio</title>
<meta name="description" content="Learn Vedic Sanskrit, Georgian, Mingrelian, Japanese, Chinese, Korean, Russian and English: lessons, word analysis and constructors, letter games, drawing by strokes, spaced repetition.">
<meta name="color-scheme" content="light dark">
<!-- color-scheme: native controls (inputs, selects, scrollbars) follow the site theme. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c3aed'/%3E%3Ctext x='16' y='22' font-size='15' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E1%83%90%E3%81%82%3C/text%3E%3C/svg%3E">
<!-- Favicon as an inline SVG data: URI (zero requests, works offline): Georgian "a" and hiragana "a" on violet, both
     percent-encoded as UTF-8 bytes. Being <text>, it renders with whatever system font has the glyphs; a path-drawn
     icon would be font-independent but much longer. -->
<!-- Cascade order is a contract: base.css (tokens, .ed-*), shell app.css (.ap-*), ./app.css (ls-, lx-, mo-, xmf-, ko-,
     xl-), then ./rhyme.css (rh-*), each later file overriding the earlier ones at equal specificity. -->
<link rel="stylesheet" href="../ui/base.css">
<link rel="stylesheet" href="../ui/app.css">
<link rel="stylesheet" href="./app.css">
<link rel="stylesheet" href="./rhyme.css">
</head>
<body class="ap">
<!-- .ap: shell hook of ui/app.css. id="main": the mount point main.js looks up (it adds .ls-main for the measure). -->
<main class="ap-main" id="main"></main>
<!-- No noscript notice here, unlike the sibling apps: without JS the page stays an empty shell. -->
<!-- type="module": deferred (runs after parsing, so #main exists), strict mode, native ES imports in development. -->
<script type="module" src="./main.js"></script>
</body>
</html>
