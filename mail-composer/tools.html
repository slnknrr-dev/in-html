<!doctype html>
<!-- mail-composer/tools.html - tools page (header encoding, address checks, SMTP transcript and other mail tools). An empty shell: tools.js builds the UI into <main>; the three pages differ only in
     title and entry module, so the shell header and nav are identical. Build strips these comments. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail Composer — Tools</title>
<!-- Favicon as an SVG data: URI: no request, works offline. %23 = '#' (a raw '#' would start a URL fragment). -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4532a'/%3E%3Cpath fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round' d='M6 9h20v14H6zM6 10l10 7 10-7'/%3E%3C/svg%3E">
<!-- Cascade order is a contract: tokens + primitives (ed-), shell (ap-), this app (mc-). -->
<link rel="stylesheet" href="../ui/base.css">
<link rel="stylesheet" href="../ui/app.css">
<link rel="stylesheet" href="./app.css">
</head>
<body class="ap">
<!-- Page registry read by common.js pageHref(): the build rewrites <a href> reliably, JS string literals it would not. -->
<a id="pg-compose" href="index.html" hidden></a>
<a id="pg-inspect" href="inspect.html" hidden></a>
<a id="pg-tools" href="tools.html" hidden></a>
<!-- Mount point; module scripts are deferred, so #main exists when tools.js runs. -->
<main class="ap-main" id="main"></main>
<script type="module" src="./tools.js"></script>
</body>
</html>
