<!doctype html>
<!-- media-player/index.html: the source page of the media player. The shell is built entirely by main.js into
     #mp-app; this file only provides the mount points, the stylesheets in cascade order and the module entry.
     singlefile.js turns it into the four artifacts (serverless, backend, Electron, offline single file). -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the page draw under the notch / home indicator; player.css then pads with
     env(safe-area-inset-*) where controls must stay clear. Without it env() always returns 0. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Media Player</title>
<meta name="description" content="A media player in the general sense: music, audiobooks, series, anime, movies, music videos and podcasts; files, links and cards known only by their description; virtual tags, smart and mood playlists, tracking like MyAnimeList, a converter with yt-dlp / ffmpeg / ImageMagick, your own skins and player layouts, a home-theatre mode.">
<!-- color-scheme: native controls, scrollbars and the pre-CSS canvas follow light or dark; theme-color is the dark
     default skin's background (skins.js may update it at runtime). -->
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#141218">
<!-- Inline SVG favicon as a data URI: no extra request and nothing to break in the single-file build. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236750a4'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='%23141218'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23d0bcff'/%3E%3Cpath d='M22 6.5l4 2.2v6.5' fill='none' stroke='%23efb8c8' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- Cascade order matters: shared primitives first, then app.css and player.css, which re-skin ed- primitives at equal
     specificity and win by order (see the CONTRACT in app.css). -->
<link rel="stylesheet" href="../ui/base.css">
<link rel="stylesheet" href="./app.css">
<link rel="stylesheet" href="./player.css">
</head>
<body class="mp-body">
<!-- Shell root. data-view (desktop | mobile | theatre | mini) is the single switch for view modes in player.css;
     main.js rewrites it. "desktop" here gives a sane grid before the module runs. -->
<div id="mp-app" class="mp-app" data-view="desktop"></div>
<!-- Host for dialogs, menus and toasts of ui/ overlays: outside #mp-app so the shell's overflow: hidden and stacking
     contexts cannot clip or bury them. -->
<div id="ed-overlays"></div>
<noscript><div class="ed-noscript">The media player needs JavaScript.</div></noscript>
<!-- At the end of body, although modules are deferred anyway; type=module gives strict mode and import graphs that
     bundle.js inlines for the built artifacts. -->
<script type="module" src="./main.js"></script>
</body>
</html>
