<!doctype html>
<!-- miner-game/index.html: Sapper (Minesweeper). An empty shell; main.js builds the whole UI into <main>. The game
     draws the board on a canvas (board.js), so static markup would add nothing; the noscript note is the only content
     for no-JS visitors. Comments are stripped from the build artifact. -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + env(safe-area-inset-bottom) in app.css: the toolbar stays clear of the iPhone home bar. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sapper</title>
<meta name="description" content="Sapper: a polished offline Minesweeper. Any board size up to 500 × 500, hexagons, torus and knight-move variants, boards without guessing, alphabets instead of numbers, six themes, seeds you can share and replays.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1f2937">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c0c0c0'/%3E%3Cpath d='M1 1h30v2H3v28H1z' fill='%23fff'/%3E%3Cpath d='M31 31H1v-2h28V1h2z' fill='%23808080'/%3E%3Cg stroke='%23111' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M16 6v20M6 16h20M9 9l14 14M23 9 9 23'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='7' fill='%23111'/%3E%3Ccircle cx='13.6' cy='13.6' r='2' fill='%23fff'/%3E%3C/svg%3E">
<!-- Cascade order: shared tokens/primitives, app shell, then this game (mn-). Later file wins equal-specificity ties. -->
<link rel="stylesheet" href="../ui/base.css">
<link rel="stylesheet" href="../ui/app.css">
<link rel="stylesheet" href="./app.css">
</head>
<body class="ap">
<main class="ap-main" id="main"></main>
<noscript><div class="ed-noscript">Sapper needs JavaScript.</div></noscript>
<!-- Module script: deferred, strict, relative imports (the reason the dev server serves the repository root). -->
<script type="module" src="./main.js"></script>
</body>
</html>
