<!doctype html>
<!-- pallete-app/index.html — Palette Studio, a single-page app (no page registry: there is nothing to navigate to).
     A shell, not a document: main.js builds the whole UI into <main>; one render path for content, i18n and state.
     The folder name keeps its historical spelling (pallete); the product name is spelled Palette.
     The build (singlefile.js) strips every comment of this file from the artifacts. -->
<html lang="en">
<!-- lang="en" is the static default; ui/i18n.js rewrites it on language switch (screen readers, hyphenation). -->
<head>
<meta charset="utf-8">
<!-- charset first: it must be inside the first 1024 bytes, before any non-ASCII text, or the parser re-decodes.
     Without the viewport meta mobile browsers lay out at ~980px and the 900/640px breakpoints never fire. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palette Studio</title>
<meta name="description" content="Colour palette studio: OKLCH harmonies, tint and shade scales, contrast and colour-vision checks, image extraction and exports. Works offline.">
<!-- color-scheme: native controls (colour inputs, range sliders, scrollbars) and the pre-CSS canvas follow the OS
     theme, so a dark-mode user gets no white flash before ui/base.css applies its tokens. -->
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Crect x='8' width='8' height='32' fill='%2322d3ee'/%3E%3Crect x='16' width='8' height='32' fill='%23fbbf24'/%3E%3Cpath d='M24 0a8 8 0 0 1 8 8v16a8 8 0 0 1-8 8z' fill='%23f43f5e'/%3E%3C/svg%3E">
<!-- Icon as a data: URI: zero requests, works from file:// and offline builds; '#' is written %23 or it would start
     a URL fragment. Cascade order (equal specificity: later wins): ui/base.css tokens and primitives (.ed-*),
     ui/app.css shell (.ap-*), then ./app.css of this app (.pal-*). -->
<link rel="stylesheet" href="../ui/base.css">
<link rel="stylesheet" href="../ui/app.css">
<link rel="stylesheet" href="./app.css">
</head>
<body class="ap">
<!-- The single mount point; id="main" is what main.js queries. -->
<main class="ap-main" id="main"></main>
<script type="module" src="./main.js"></script>
<!-- type=module: deferred by default (runs after parsing, so #main exists), strict mode, ES imports of ../ libraries. -->
</body>
</html>
