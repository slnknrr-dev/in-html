<!doctype html>
<!-- receipt-studio/returns.html — returns page: past receipts, return lines, refund receipt. A shell, not a document: the page script builds all UI into <main>.
     Why an empty shell: one render path (JS) for content, i18n and state; static markup would duplicate it and drift.
     The three pages (index = POS, returns, shift) share this exact head and anchor registry; only the script differs.
     The build (singlefile.js) strips every comment of this file from the artifacts. -->
<html lang="en">
<!-- lang="en" is the static default; ui/i18n.js rewrites it on language switch (screen readers, hyphenation). -->
<head>
<meta charset="utf-8">
<!-- charset first: it must be inside the first 1024 bytes, before any non-ASCII text, or the parser re-decodes.
     Without the viewport meta mobile browsers lay out at ~980px and no max-width media query in app.css fires. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b45309'/%3E%3Cpath fill='%23fff' d='M9 5h14v23l-2.3-1.6L18.3 28 16 26.4 13.7 28l-2.4-1.6L9 28zm3 6v2h8v-2zm0 5v2h8v-2zm0 5v2h5v-2z'/%3E%3C/svg%3E">
<!-- Icon as a data: URI (a receipt with a torn edge): zero requests, works from file:// and in offline builds.
     URL-encoded, not base64: shorter for SVG; '#' must be %23 or it would start a URL fragment. -->
<!-- Cascade order is a contract (equal specificity: later file wins): ui/base.css tokens and primitives (.ed-*),
     ui/app.css shell (.ap-*), then ./app.css of this app (.rs-*), which may override the first two. -->
<link rel="stylesheet" href="../ui/base.css">
<link rel="stylesheet" href="../ui/app.css">
<link rel="stylesheet" href="./app.css">
</head>
<body class="ap">
<!-- Page registry as hidden anchors, read by common.js pageHref(id) for the shell's navigation. Anchors, not JS
     constants: the build rewrites href attributes when it renames or inlines pages, and it cannot see strings in JS. -->
<a id="pg-pos" href="index.html" hidden></a>
<a id="pg-returns" href="returns.html" hidden></a>
<a id="pg-shift" href="shift.html" hidden></a>
<!-- The single mount point; id="main" is what the page script queries. -->
<main class="ap-main" id="main"></main>
<script type="module" src="./returns.js"></script>
<!-- type=module: deferred by default (runs after parsing, so #main exists), strict mode, ES imports of ../ libraries. -->
</body>
</html>
