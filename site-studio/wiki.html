<!doctype html>
<!-- site-studio/wiki.html — knowledge-base editor page. A shell: wiki-main.js builds the whole UI into <body>.
     Why an empty shell: one render path (JS) for content, i18n and state; static markup would duplicate it and drift.
     The reader of an exported knowledge base is NOT this page: exports carry their own HTML plus wiki-reader-boot.js
     (see wiki-bundles.js), so nothing here leaks into published sites. Build strips these comments from artifacts. -->
<html lang="en">
<!-- lang="en" is the static default only; ui/i18n.js rewrites it on language switch (screen readers, hyphenation). -->
<head>
<meta charset="utf-8">
<!-- charset first: must sit in the first 1024 bytes, before any non-ASCII byte (the "·" in the title). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- viewport-fit=cover: the editor is a full-height app (body.kp-body is a 100%-height flex column), so on notched
     phones it extends under the safe areas; without it the browser letterboxes the page. -->
<meta name="color-scheme" content="light dark">
<!-- color-scheme: native controls, scrollbars and the pre-CSS canvas follow the OS theme, so dark users get no white
     flash before ui/base.css loads its dark tokens. -->
<title>Site Studio · knowledge bases</title>
<meta name="description" content="Knowledge base and wiki builder: pages with Wikipedia-like blocks (infoboxes, references, navboxes, timelines), annotated pictures with clickable regions, hover previews, versions of a page, toggleable layers for translations and transcription, password-encrypted 451 pages; published as one HTML file, a static site or a Node server.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M9 7h10l5 5v13H9z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M12 15h3v3h-3zM18 16.5h3M12 21h9' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- Icon as URL-encoded SVG data: URI: zero requests, works from file:// and offline builds. '#' must be %23 or it
     starts a URL fragment and truncates the image. -->
<!-- Cascade order is a contract (equal specificity: later file wins):
       1. ui/base.css        tokens (--ed-*), reset, shared primitives (.ed-*)
       2. ui/app.css         app shell (.ap-*)
       3. ./wiki-editor.css  this editor (.kp-*), overrides 1-2 without !important
     Reordering breaks overrides silently. -->
<link rel="stylesheet" href="../ui/base.css">
<link rel="stylesheet" href="../ui/app.css">
<link rel="stylesheet" href="./wiki-editor.css">
</head>
<body class="kp-body">
<!-- .kp-body: hook for wiki-editor.css (fixed-height flex column, inner panes scroll, the page does not). -->
<!-- noscript: .ed-noscript (ui/base.css) is a fixed full-screen layer at z-index 600, above every other overlay. -->
<noscript><div class="ed-noscript">Site Studio needs JavaScript. It runs in your browser; your knowledge bases stay on this device.</div></noscript>
<!-- type="module": deferred by spec (runs after parse, body exists), strict mode, ES imports; bundled by the build. -->
<script type="module" src="./wiki-main.js"></script>
</body>
</html>
