 petals.','A central grid and four grids shifted by one box up, down, left and right. All five follow the classic rules.'],diagonal:['Diagonal (X)','Both main diagonals hold every symbol once.','Classic rules, and each of the two main diagonals also contains every symbol exactly once.'],windoku:['Windoku','Extra shaded windows hold every symbol once.','Classic rules plus shaded windows of box size placed one cell in from the box corners (four on 9×9). Each window also contains every symbol once.'],disjoint:['Disjoint groups','The same position in every box: all different.','Cells in the same position inside their boxes (all top-left cells, all centre cells…) form groups that contain every symbol once.'],centerdot:['Centre dot','The centres of the boxes form one more group.','The centre cells of all boxes together contain every symbol once.'],asterisk:['Asterisk','Nine shaded cells in a star.','The nine shaded cells that form an asterisk contain every symbol once.'],girandola:['Girandola','Nine shaded cells in a pinwheel.','The nine shaded cells (the corners, the centre and a pinwheel around it) contain every symbol once.'],antiknight:['Anti-knight','Equal symbols are never a knight\'s move apart.','Classic rules, and two cells a chess knight\'s move apart (two steps one way, one step the other) never hold the same symbol.'],antiking:['Anti-king','Equal symbols never touch diagonally.','Classic rules, and cells that touch diagonally (a chess king\'s step) never hold the same symbol.'],nonconsecutive:['Non-consecutive','Neighbours never differ by 1.','Cells that share a side never contain consecutive numbers (such as 4 and 5).'],magic:['Magic square','The centre box is a magic square.','Classic 9×9 rules, and in the shaded centre box every row, every column and both diagonals sum to 15.'],killer:['Killer','Cages with sums, no repeats inside a cage.','Dashed cages show the sum of their cells. Symbols do not repeat within a cage. Usually few symbols, or none, are given.'],evenodd:['Even–odd','Circles are odd, squares are even.','A grey circle holds an odd number, a grey square an even number.'],kropki:['Kropki','White dot: consecutive. Black dot: one is double.','A white dot between two cells: their numbers differ by 1. A black dot: one number is twice the other (between 1 and 2 either dot may be shown).\nAll dots are given: neighbours without a dot have neither relation.'],xv:['XV','X: the pair sums to 10. V: to 5.','Two cells joined by an X sum to 10, joined by a V to 5.\nAll X and V are shown: other neighbours sum to neither.'],consecutive:['Consecutive','Bars join consecutive numbers.','A bar between two cells: their numbers differ by 1.\nAll bars are shown: neighbours without a bar are never consecutive.'],greater:['Greater than','Signs tell which neighbour is bigger.','The chevron between two cells points at the smaller number.'],quadruple:['Quadruple','Circles list symbols of the four cells around.','A circle on the corner of four cells lists symbols that appear in those four cells.'],thermo:['Thermometer','Numbers rise from the bulb.','Along each thermometer the numbers strictly increase from the bulb to the other end.'],arrow:['Arrow','The circle is the sum along its arrow.','The number in a circle equals the sum of the numbers along its arrow. Numbers may repeat on an arrow where the other rules allow it.'],renban:['Renban','A line holds a run of consecutive numbers.','Each purple line contains different consecutive numbers in any order (for example 4 6 5 3).'],whisper:['German whispers','Neighbours on a line differ by at least 5.','Adjacent cells along a green line differ by at least 5 (on 9×9; on other sizes by at least half the size, rounded up).'],dutch:['Dutch whispers','Neighbours on a line differ by at least 4.','Adjacent cells along an orange line differ by at least 4 (half the size, rounded down).'],palindrome:['Palindrome','Lines read the same both ways.','Each grey line reads the same from either end: cells equally far from the two ends hold the same symbol.'],parityline:['Parity line','Odd and even alternate along a line.','Along a red line odd and even numbers alternate.'],between:['Between line','Inner cells lie between the ends.','On a line with circles at both ends, every cell inside the line holds a number strictly between the two circled numbers.'],zipper:['Zipper','Pairs around the middle share one sum.','On a zipper line, cells equally far from the centre of the line sum to the number in the centre cell.'],entropic:['Entropic line','Any three in a row: low, middle and high.','The numbers form three groups (on 9×9: 1–3 low, 4–6 middle, 7–9 high). Any three adjacent cells along a yellow line contain one number of each group.'],modular:['Modular line','Any three in a row: different remainders by 3.','Any three adjacent cells along a teal line leave different remainders when divided by 3 (one of 1 4 7, one of 2 5 8, one of 3 6 9).'],sandwich:['Sandwich','Sums between the smallest and the largest.','A number outside the grid is the sum of the numbers between the 1 and the largest number (9 on 9×9) in that row or column.'],skyscraper:['Skyscraper','How many towers you see from the side.','Numbers are towers of that height. A clue outside the grid tells how many towers are visible from there: taller towers hide the shorter ones behind them.'],xsums:['X-sums','The first X cells sum to the clue.','A clue outside is the sum of the first X numbers seen from that side, where X is the first of those numbers.'],frame:['Frame','Sums of the first cells next to the frame.','A clue outside is the sum of the first numbers seen from that side, as many as a box is wide (or high): three on 9×9.'],littlekiller:['Little killer','Sums along diagonals, given outside.','A small arrow outside the grid points along a diagonal; the clue is the sum of all numbers on it. Numbers may repeat on a diagonal.'],},ru:{classic:['Классика','Оригинал: строки, столбцы и блоки содержат каждый символ один раз.','В каждой строке, каждом столбце и каждом выделенном блоке все символы встречаются ровно по одному разу.\nБольшие сетки после 9 продолжаются буквами. Размеры, которые не являются квадратами, используют блоки другой формы (2×3, 3×4, 4×5…) или вовсе обходятся без блоков — это латинский квадрат.'],jigsaw:['Пазл','Фигурные области вместо блоков.','Блоки заменены областями неправильной формы (раскрашены чередующимися оттенками). В каждой строке, столбце и области каждый символ встречается один раз.'],samurai:['Самурай','Пять пересекающихся сеток крестом.','Пять сеток пересекаются угловыми блоками. Каждая сетка подчиняется классическим правилам; общий блок принадлежит сразу двум сеткам.'],twodoku:['Двойное','Две сетки с общим угловым блоком.','Две классические сетки пересекаются одним блоком, который должен удовлетворять обеим.'],butterfly:['Бабочка','Четыре сетки внутри одного квадрата.','Четыре сетки, сдвинутые на блок друг относительно друга, перекрываются в одном квадрате (12×12 для сеток 9×9). Каждая подчиняется классическим правилам.'],sohei:['Сохэй','Четыре сетки кольцом вокруг пустого центра.','Четыре сетки образуют кольцо; каждая делит угловой блок с двумя соседними. Все четыре подчиняются классическим правилам.'],flower:['Цветок','Центральная сетка и четыре лепестка.','Центральная сетка и четыре сетки, сдвинутые на блок вверх, вниз, влево и вправо. Все пять подчиняются классическим правилам.'],diagonal:['Диагональное (X)','Обе главные диагонали содержат все символы.','Классические правила, и на каждой из двух главных диагоналей каждый символ тоже встречается ровно один раз.'],windoku:['Окна (Windoku)','Дополнительные затенённые окна.','Классические правила и затенённые окна размером с блок, отступающие на клетку от углов блоков (четыре на 9×9). В каждом окне каждый символ тоже встречается один раз.'],disjoint:['Несвязные группы','Одинаковое место в каждом блоке — разные символы.','Клетки, стоящие на одном и том же месте в своих блоках (все левые верхние, все центральные…), образуют группы, где каждый символ встречается один раз.'],centerdot:['Центральная точка','Центры блоков — ещё одна группа.','Центральные клетки всех блоков вместе содержат каждый символ по одному разу.'],asterisk:['Звёздочка','Девять затенённых клеток звездой.','Девять затенённых клеток, образующих звёздочку, содержат каждый символ по одному разу.'],girandola:['Жирандоль','Девять затенённых клеток вертушкой.','Девять затенённых клеток (углы, центр и вертушка вокруг него) содержат каждый символ по одному разу.'],antiknight:['Антиконь','Одинаковые символы не стоят на расстоянии хода коня.','Классические правила, и две клетки на расстоянии хода шахматного коня (две клетки в одну сторону, одна в другую) никогда не содержат одинаковых символов.'],antiking:['Антикороль','Одинаковые символы не касаются по диагонали.','Классические правила, и клетки, касающиеся по диагонали (шаг шахматного короля), никогда не содержат одинаковых символов.'],nonconsecutive:['Непоследовательное','Соседи не отличаются на 1.','Клетки с общей стороной никогда не содержат соседние числа (например 4 и 5).'],magic:['Магический квадрат','Центральный блок — магический квадрат.','Классические правила 9×9, и в затенённом центральном блоке сумма каждой строки, каждого столбца и обеих диагоналей равна 15.'],killer:['Киллер','Клетки-«клетки» с суммами, без повторов внутри.','Пунктирные области показывают сумму своих клеток. Внутри области символы не повторяются. Обычно дано мало символов или ни одного.'],evenodd:['Чёт-нечет','Кружок — нечётное, квадрат — чётное.','В клетке с серым кружком стоит нечётное число, с серым квадратом — чётное.'],kropki:['Кропки','Белая точка — соседние числа, чёрная — одно вдвое больше.','Белая точка между клетками: числа отличаются на 1. Чёрная точка: одно число вдвое больше другого (между 1 и 2 может стоять любая точка).\nПоказаны все точки: у соседей без точки нет ни того, ни другого отношения.'],xv:['XV','X — сумма пары 10, V — 5.','Клетки, соединённые X, в сумме дают 10, соединённые V — 5.\nПоказаны все X и V: остальные соседи не дают в сумме ни 10, ни 5.'],consecutive:['Последовательное','Черта соединяет соседние числа.','Черта между клетками: числа отличаются на 1.\nПоказаны все черты: соседи без черты никогда не отличаются на 1.'],greater:['Больше-меньше','Знаки показывают, какой сосед больше.','Уголок между клетками направлен острием к меньшему числу.'],quadruple:['Четвёрки','Кружок перечисляет символы четырёх клеток вокруг.','Кружок на углу четырёх клеток перечисляет символы, которые стоят в этих четырёх клетках.'],thermo:['Термометр','Числа растут от колбы.','Вдоль каждого термометра числа строго возрастают от колбы к другому концу.'],arrow:['Стрелки','Число в круге — сумма вдоль стрелки.','Число в круге равно сумме чисел вдоль его стрелки. На стрелке числа могут повторяться, если остальные правила это позволяют.'],renban:['Ренбан','Линия содержит подряд идущие числа.','Каждая фиолетовая линия содержит разные подряд идущие числа в любом порядке (например 4 6 5 3).'],whisper:['Немецкий шёпот','Соседи на линии отличаются минимум на 5.','Соседние клетки вдоль зелёной линии отличаются минимум на 5 (на 9×9; на других размерах — минимум на половину размера с округлением вверх).'],dutch:['Голландский шёпот','Соседи на линии отличаются минимум на 4.','Соседние клетки вдоль оранжевой линии отличаются минимум на 4 (половина размера с округлением вниз).'],palindrome:['Палиндром','Линии читаются одинаково в обе стороны.','Каждая серая линия читается одинаково с обоих концов: клетки на равном расстоянии от концов содержат один символ.'],parityline:['Линия чётности','Чётные и нечётные чередуются.','Вдоль красной линии чётные и нечётные числа чередуются.'],between:['Линия «между»','Внутренние клетки лежат между концами.','На линии с кружками на обоих концах каждая внутренняя клетка содержит число строго между двумя числами в кружках.'],zipper:['Застёжка','Пары вокруг середины дают одну сумму.','На линии-застёжке клетки, равноудалённые от центра линии, в сумме дают число в центральной клетке.'],entropic:['Энтропийная линия','Любые три подряд: малое, среднее и большое.','Числа делятся на три группы (на 9×9: 1–3 малые, 4–6 средние, 7–9 большие). Любые три соседние клетки вдоль жёлтой линии содержат по числу из каждой группы.'],modular:['Модульная линия','Любые три подряд — разные остатки от деления на 3.','Любые три соседние клетки вдоль бирюзовой линии дают разные остатки при делении на 3 (одно из 1 4 7, одно из 2 5 8, одно из 3 6 9).'],sandwich:['Сэндвич','Суммы между самым малым и самым большим.','Число за сеткой — сумма чисел между 1 и наибольшим числом (9 на 9×9) в этой строке или столбце.'],skyscraper:['Небоскрёбы','Сколько башен видно сбоку.','Числа — башни такой высоты. Подсказка за сеткой говорит, сколько башен видно с этой стороны: высокие заслоняют низкие позади себя.'],xsums:['X-суммы','Первые X клеток дают сумму подсказки.','Подсказка за сеткой — сумма первых X чисел с этой стороны, где X — первое из них.'],frame:['Рамка','Суммы первых клеток у рамки.','Подсказка за сеткой — сумма первых чисел с этой стороны, их столько, какова ширина (или высота) блока: три на 9×9.'],littlekiller:['Малый киллер','Суммы вдоль диагоналей, заданные снаружи.','Маленькая стрелка за сеткой указывает вдоль диагонали; подсказка — сумма всех чисел на ней. На диагонали числа могут повторяться.'],},uk:{classic:['Класика','Оригінал: рядки, стовпці й блоки містять кожен символ один раз.','У кожному рядку, кожному стовпці та кожному виділеному блоці всі символи трапляються рівно по одному разу.\nВеликі сітки після 9 продовжуються літерами. Розміри, що не є квадратами, мають блоки іншої форми (2×3, 3×4, 4×5…) або зовсім без блоків — це латинський квадрат.'],jigsaw:['Пазл','Фігурні області замість блоків.','Блоки замінено областями неправильної форми (розфарбовані відтінками). У кожному рядку, стовпці й області кожен символ трапляється один раз.'],samurai:['Самурай','П\'ять сіток, що перетинаються хрестом.','П\'ять сіток перетинаються кутовими блоками. Кожна сітка підкоряється класичним правилам; спільний блок належить одразу двом сіткам.'],twodoku:['Подвійне','Дві сітки зі спільним кутовим блоком.','Дві класичні сітки перетинаються одним блоком, який має задовольняти обидві.'],butterfly:['Метелик','Чотири сітки всередині одного квадрата.','Чотири сітки, зсунуті на блок, перекриваються в одному квадраті (12×12 для сіток 9×9). Кожна підкоряється класичним правилам.'],sohei:['Сохей','Чотири сітки кільцем довкола порожнього центру.','Чотири сітки утворюють кільце; кожна має спільний кутовий блок із двома сусідніми. Усі чотири підкоряються класичним правилам.'],flower:['Квітка','Центральна сітка й чотири пелюстки.','Центральна сітка й чотири сітки, зсунуті на блок угору, вниз, ліворуч і праворуч. Усі п\'ять підкоряються класичним правилам.'],diagonal:['Діагональне (X)','Обидві головні діагоналі містять усі символи.','Класичні правила, і на кожній із двох головних діагоналей кожен символ теж трапляється рівно один раз.'],windoku:['Вікна (Windoku)','Додаткові затінені вікна.','Класичні правила й затінені вікна розміром із блок, відступлені на клітинку від кутів блоків (чотири на 9×9). У кожному вікні кожен символ теж трапляється один раз.'],disjoint:['Незв\'язні групи','Те саме місце в кожному блоці — різні символи.','Клітинки на тому самому місці у своїх блоках (усі ліві верхні, усі центральні…) утворюють групи, де кожен символ трапляється один раз.'],centerdot:['Центральна точка','Центри блоків — ще одна група.','Центральні клітинки всіх блоків разом містять кожен символ по одному разу.'],asterisk:['Зірочка','Дев\'ять затінених клітинок зіркою.','Дев\'ять затінених клітинок, що утворюють зірочку, містять кожен символ по одному разу.'],girandola:['Жирандоль','Дев\'ять затінених клітинок вертушкою.','Дев\'ять затінених клітинок (кути, центр і вертушка довкола нього) містять кожен символ по одному разу.'],antiknight:['Антикінь','Однакові символи не стоять на відстані ходу коня.','Класичні правила, і дві клітинки на відстані ходу шахового коня (дві клітинки в один бік, одна в інший) ніколи не містять однакових символів.'],antiking:['Антикороль','Однакові символи не торкаються по діагоналі.','Класичні правила, і клітинки, що торкаються по діагоналі (крок шахового короля), ніколи не містять однакових символів.'],nonconsecutive:['Непослідовне','Сусіди не відрізняються на 1.','Клітинки зі спільною стороною ніколи не містять сусідніх чисел (наприклад 4 і 5).'],magic:['Магічний квадрат','Центральний блок — магічний квадрат.','Класичні правила 9×9, і в затіненому центральному блоці сума кожного рядка, кожного стовпця й обох діагоналей дорівнює 15.'],killer:['Кілер','Області із сумами, без повторів усередині.','Пунктирні області показують суму своїх клітинок. Усередині області символи не повторюються. Зазвичай дано мало символів або жодного.'],evenodd:['Парне-непарне','Кружечок — непарне, квадрат — парне.','У клітинці із сірим кружечком стоїть непарне число, із сірим квадратом — парне.'],kropki:['Кропки','Біла крапка — сусідні числа, чорна — одне вдвічі більше.','Біла крапка між клітинками: числа відрізняються на 1. Чорна крапка: одне число вдвічі більше за інше (між 1 і 2 може стояти будь-яка крапка).\nПоказано всі крапки: у сусідів без крапки немає жодного з цих відношень.'],xv:['XV','X — сума пари 10, V — 5.','Клітинки, з\'єднані X, у сумі дають 10, з\'єднані V — 5.\nПоказано всі X і V: решта сусідів не дає в сумі ні 10, ні 5.'],consecutive:['Послідовне','Риска з\'єднує сусідні числа.','Риска між клітинками: числа відрізняються на 1.\nПоказано всі риски: сусіди без риски ніколи не відрізняються на 1.'],greater:['Більше-менше','Знаки показують, який сусід більший.','Кутик між клітинками вказує вістрям на менше число.'],quadruple:['Четвірки','Кружечок перелічує символи чотирьох клітинок довкола.','Кружечок на куті чотирьох клітинок перелічує символи, що стоять у цих чотирьох клітинках.'],thermo:['Термометр','Числа зростають від колби.','Уздовж кожного термометра числа строго зростають від колби до іншого кінця.'],arrow:['Стрілки','Число в колі — сума вздовж стрілки.','Число в колі дорівнює сумі чисел уздовж його стрілки. На стрілці числа можуть повторюватися, якщо інші правила дозволяють.'],renban:['Ренбан','Лінія містить числа, що йдуть поспіль.','Кожна фіолетова лінія містить різні числа, що йдуть поспіль, у будь-якому порядку (наприклад 4 6 5 3).'],whisper:['Німецький шепіт','Сусіди на лінії відрізняються щонайменше на 5.','Сусідні клітинки вздовж зеленої лінії відрізняються щонайменше на 5 (на 9×9; на інших розмірах — щонайменше на половину розміру з округленням угору).'],dutch:['Голландський шепіт','Сусіди на лінії відрізняються щонайменше на 4.','Сусідні клітинки вздовж помаранчевої лінії відрізняються щонайменше на 4 (половина розміру з округленням униз).'],palindrome:['Паліндром','Лінії читаються однаково в обидва боки.','Кожна сіра лінія читається однаково з обох кінців: клітинки на однаковій відстані від кінців містять той самий символ.'],parityline:['Лінія парності','Парні й непарні чергуються.','Уздовж червоної лінії парні й непарні числа чергуються.'],between:['Лінія «між»','Внутрішні клітинки лежать між кінцями.','На лінії з кружечками на обох кінцях кожна внутрішня клітинка містить число строго між двома числами в кружечках.'],zipper:['Блискавка','Пари довкола середини дають одну суму.','На лінії-блискавці клітинки, рівновіддалені від центру лінії, у сумі дають число в центральній клітинці.'],entropic:['Ентропійна лінія','Будь-які три поспіль: мале, середнє й велике.','Числа поділено на три групи (на 9×9: 1–3 малі, 4–6 середні, 7–9 великі). Будь-які три сусідні клітинки вздовж жовтої лінії містять по числу з кожної групи.'],modular:['Модульна лінія','Будь-які три поспіль — різні остачі від ділення на 3.','Будь-які три сусідні клітинки вздовж бірюзової лінії дають різні остачі від ділення на 3 (одне з 1 4 7, одне з 2 5 8, одне з 3 6 9).'],sandwich:['Сендвіч','Суми між найменшим і найбільшим.','Число за сіткою — сума чисел між 1 і найбільшим числом (9 на 9×9) у цьому рядку чи стовпці.'],skyscraper:['Хмарочоси','Скільки веж видно збоку.','Числа — вежі такої висоти. Підказка за сіткою каже, скільки веж видно з цього боку: вищі затуляють нижчі позаду себе.'],xsums:['X-суми','Перші X клітинок дають суму підказки.','Підказка за сіткою — сума перших X чисел із цього боку, де X — перше з них.'],frame:['Рамка','Суми перших клітинок біля рамки.','Підказка за сіткою — сума перших чисел із цього боку, їх стільки, яка ширина (або висота) блока: три на 9×9.'],littlekiller:['Малий кілер','Суми вздовж діагоналей, задані ззовні.','Маленька стрілка за сіткою вказує вздовж діагоналі; підказка — сума всіх чисел на ній. На діагоналі числа можуть повторюватися.'],},de:{classic:['Klassisch','Das Original: Zeilen, Spalten und Blöcke enthalten jedes Symbol einmal.','Jede Zeile, jede Spalte und jeder umrandete Block enthält jedes Symbol genau einmal.\nGroße Gitter gehen nach der 9 mit Buchstaben weiter. Größen, die keine Quadratzahlen sind, haben Blöcke anderer Form (2×3, 3×4, 4×5…) oder gar keine Blöcke – dann ist es ein lateinisches Quadrat.'],jigsaw:['Puzzle (Jigsaw)','Unregelmäßige Gebiete statt Blöcken.','Die Blöcke sind durch unregelmäßige, abwechselnd getönte Gebiete ersetzt. Jede Zeile, Spalte und jedes Gebiet enthält jedes Symbol einmal.'],samurai:['Samurai','Fünf überlappende Gitter als Kreuz.','Fünf Gitter überlappen an ihren Eckblöcken. Jedes Gitter folgt den klassischen Regeln; ein gemeinsamer Block gehört zu zwei Gittern zugleich.'],twodoku:['Twodoku','Zwei Gitter mit gemeinsamem Eckblock.','Zwei klassische Gitter überlappen in einem Block, der beide erfüllen muss.'],butterfly:['Schmetterling','Vier Gitter in einem Quadrat.','Vier um je einen Block versetzte Gitter überlappen in einem Quadrat (12×12 bei 9×9-Gittern). Jedes folgt den klassischen Regeln.'],sohei:['Sohei','Vier Gitter im Ring um eine leere Mitte.','Vier Gitter bilden einen Ring; jedes teilt einen Eckblock mit zwei Nachbarn. Alle vier folgen den klassischen Regeln.'],flower:['Blume','Ein Mittelgitter mit vier Blütenblättern.','Ein zentrales Gitter und vier um einen Block nach oben, unten, links und rechts versetzte Gitter. Alle fünf folgen den klassischen Regeln.'],diagonal:['Diagonal (X)','Beide Hauptdiagonalen enthalten jedes Symbol einmal.','Klassische Regeln, und auch jede der beiden Hauptdiagonalen enthält jedes Symbol genau einmal.'],windoku:['Windoku','Zusätzliche schattierte Fenster.','Klassische Regeln plus schattierte Fenster in Blockgröße, eine Zelle von den Blockecken eingerückt (vier bei 9×9). Auch jedes Fenster enthält jedes Symbol einmal.'],disjoint:['Disjunkte Gruppen','Gleiche Position in jedem Block: alle verschieden.','Zellen an derselben Position ihrer Blöcke (alle oben links, alle in der Mitte…) bilden Gruppen, die jedes Symbol einmal enthalten.'],centerdot:['Mittelpunkt','Die Blockmitten bilden eine weitere Gruppe.','Die Mittelzellen aller Blöcke enthalten zusammen jedes Symbol einmal.'],asterisk:['Sternchen','Neun schattierte Zellen als Stern.','Die neun schattierten Zellen in Sternform enthalten jedes Symbol einmal.'],girandola:['Girandola','Neun schattierte Zellen als Windrad.','Die neun schattierten Zellen (Ecken, Mitte und ein Windrad darum) enthalten jedes Symbol einmal.'],antiknight:['Anti-Springer','Gleiche Symbole nie einen Rösselsprung entfernt.','Klassische Regeln, und zwei Zellen, die einen Rösselsprung voneinander entfernt sind (zwei Schritte in eine, einer in die andere Richtung), enthalten nie dasselbe Symbol.'],antiking:['Anti-König','Gleiche Symbole berühren sich nie diagonal.','Klassische Regeln, und diagonal benachbarte Zellen (ein Königsschritt) enthalten nie dasselbe Symbol.'],nonconsecutive:['Nicht aufeinanderfolgend','Nachbarn unterscheiden sich nie um 1.','Zellen mit gemeinsamer Kante enthalten nie aufeinanderfolgende Zahlen (wie 4 und 5).'],magic:['Magisches Quadrat','Der Mittelblock ist ein magisches Quadrat.','Klassische 9×9-Regeln, und im schattierten Mittelblock ergeben jede Zeile, jede Spalte und beide Diagonalen die Summe 15.'],killer:['Killer','Käfige mit Summen, keine Wiederholung im Käfig.','Gestrichelte Käfige zeigen die Summe ihrer Zellen. Innerhalb eines Käfigs wiederholen sich keine Symbole. Meist sind wenige oder keine Symbole vorgegeben.'],evenodd:['Gerade–ungerade','Kreise sind ungerade, Quadrate gerade.','Ein grauer Kreis enthält eine ungerade Zahl, ein graues Quadrat eine gerade.'],kropki:['Kropki','Weißer Punkt: aufeinanderfolgend. Schwarz: das Doppelte.','Ein weißer Punkt zwischen zwei Zellen: die Zahlen unterscheiden sich um 1. Ein schwarzer Punkt: eine Zahl ist das Doppelte der anderen (zwischen 1 und 2 kann jeder Punkt stehen).\nAlle Punkte sind gegeben: Nachbarn ohne Punkt haben keine der beiden Beziehungen.'],xv:['XV','X: Summe 10, V: Summe 5.','Durch X verbundene Zellen ergeben zusammen 10, durch V verbundene 5.\nAlle X und V sind gezeigt: andere Nachbarn ergeben weder 10 noch 5.'],consecutive:['Aufeinanderfolgend','Balken verbinden aufeinanderfolgende Zahlen.','Ein Balken zwischen zwei Zellen: die Zahlen unterscheiden sich um 1.\nAlle Balken sind gezeigt: Nachbarn ohne Balken folgen nie aufeinander.'],greater:['Größer als','Zeichen zeigen den größeren Nachbarn.','Die Spitze zwischen zwei Zellen zeigt auf die kleinere Zahl.'],quadruple:['Quadrupel','Kreise nennen Symbole der vier Zellen ringsum.','Ein Kreis an der Ecke von vier Zellen nennt Symbole, die in diesen vier Zellen vorkommen.'],thermo:['Thermometer','Zahlen steigen von der Kugel an.','Entlang jedes Thermometers steigen die Zahlen von der Kugel zum anderen Ende streng an.'],arrow:['Pfeil','Der Kreis ist die Summe entlang seines Pfeils.','Die Zahl im Kreis ist die Summe der Zahlen entlang seines Pfeils. Auf einem Pfeil dürfen sich Zahlen wiederholen, wo die übrigen Regeln es zulassen.'],renban:['Renban','Eine Linie enthält eine Folge aufeinanderfolgender Zahlen.','Jede violette Linie enthält verschiedene aufeinanderfolgende Zahlen in beliebiger Reihenfolge (etwa 4 6 5 3).'],whisper:['Deutsches Flüstern','Nachbarn auf der Linie unterscheiden sich um mindestens 5.','Benachbarte Zellen entlang einer grünen Linie unterscheiden sich um mindestens 5 (bei 9×9; sonst um mindestens die halbe Größe, aufgerundet).'],dutch:['Holländisches Flüstern','Nachbarn auf der Linie unterscheiden sich um mindestens 4.','Benachbarte Zellen entlang einer orangen Linie unterscheiden sich um mindestens 4 (die halbe Größe, abgerundet).'],palindrome:['Palindrom','Linien lesen sich in beide Richtungen gleich.','Jede graue Linie liest sich von beiden Enden gleich: Zellen in gleichem Abstand von den Enden enthalten dasselbe Symbol.'],parityline:['Paritätslinie','Gerade und ungerade wechseln sich ab.','Entlang einer roten Linie wechseln sich gerade und ungerade Zahlen ab.'],between:['Zwischenlinie','Innere Zellen liegen zwischen den Enden.','Auf einer Linie mit Kreisen an beiden Enden enthält jede innere Zelle eine Zahl echt zwischen den beiden eingekreisten Zahlen.'],zipper:['Reißverschluss','Paare um die Mitte haben dieselbe Summe.','Auf einer Reißverschlusslinie ergeben Zellen gleich weit von der Linienmitte zusammen die Zahl der Mittelzelle.'],entropic:['Entropische Linie','Je drei in Folge: niedrig, mittel und hoch.','Die Zahlen bilden drei Gruppen (bei 9×9: 1–3 niedrig, 4–6 mittel, 7–9 hoch). Je drei benachbarte Zellen entlang einer gelben Linie enthalten eine Zahl jeder Gruppe.'],modular:['Modulare Linie','Je drei in Folge: verschiedene Reste durch 3.','Je drei benachbarte Zellen entlang einer türkisen Linie lassen verschiedene Reste bei Division durch 3 (eine aus 1 4 7, eine aus 2 5 8, eine aus 3 6 9).'],sandwich:['Sandwich','Summen zwischen der kleinsten und der größten Zahl.','Eine Zahl außerhalb des Gitters ist die Summe der Zahlen zwischen der 1 und der größten Zahl (9 bei 9×9) in dieser Zeile oder Spalte.'],skyscraper:['Wolkenkratzer','Wie viele Türme man von der Seite sieht.','Zahlen sind Türme dieser Höhe. Ein Hinweis außerhalb sagt, wie viele Türme von dort zu sehen sind: höhere verdecken die niedrigeren dahinter.'],xsums:['X-Summen','Die ersten X Zellen ergeben den Hinweis.','Ein Hinweis außen ist die Summe der ersten X Zahlen von dieser Seite, wobei X die erste dieser Zahlen ist.'],frame:['Rahmen','Summen der ersten Zellen am Rahmen.','Ein Hinweis außen ist die Summe der ersten Zahlen von dieser Seite, so viele wie ein Block breit (oder hoch) ist: drei bei 9×9.'],littlekiller:['Kleiner Killer','Summen entlang Diagonalen, außen angegeben.','Ein kleiner Pfeil außerhalb zeigt entlang einer Diagonale; der Hinweis ist die Summe aller Zahlen darauf. Auf einer Diagonale dürfen sich Zahlen wiederholen.'],},fr:{classic:['Classique','L’original : lignes, colonnes et blocs contiennent chaque symbole une fois.','Chaque ligne, chaque colonne et chaque bloc encadré contient chaque symbole exactement une fois.\nLes grandes grilles continuent avec des lettres après 9. Les tailles qui ne sont pas des carrés ont des blocs d’autres formes (2×3, 3×4, 4×5…) ou aucun bloc : c’est alors un carré latin.'],jigsaw:['Puzzle (Jigsaw)','Des régions irrégulières à la place des blocs.','Les blocs sont remplacés par des régions irrégulières, teintées en alternance. Chaque ligne, colonne et région contient chaque symbole une fois.'],samurai:['Samouraï','Cinq grilles qui se chevauchent en croix.','Cinq grilles se chevauchent par leurs blocs de coin. Chaque grille suit les règles classiques ; un bloc partagé appartient à deux grilles à la fois.'],twodoku:['Twodoku','Deux grilles qui partagent un bloc de coin.','Deux grilles classiques se chevauchent sur un bloc, qui doit satisfaire les deux.'],butterfly:['Papillon','Quatre grilles dans un même carré.','Quatre grilles décalées d’un bloc se chevauchent dans un seul carré (12×12 pour des grilles 9×9). Chacune suit les règles classiques.'],sohei:['Sohei','Quatre grilles en anneau autour d’un centre vide.','Quatre grilles forment un anneau ; chacune partage un bloc de coin avec deux voisines. Les quatre suivent les règles classiques.'],flower:['Fleur','Une grille centrale et quatre pétales.','Une grille centrale et quatre grilles décalées d’un bloc vers le haut, le bas, la gauche et la droite. Les cinq suivent les règles classiques.'],diagonal:['Diagonale (X)','Les deux grandes diagonales contiennent chaque symbole une fois.','Règles classiques, et chacune des deux grandes diagonales contient aussi chaque symbole exactement une fois.'],windoku:['Windoku','Des fenêtres grisées en plus.','Règles classiques plus des fenêtres grisées de la taille d’un bloc, décalées d’une case des coins des blocs (quatre en 9×9). Chaque fenêtre contient aussi chaque symbole une fois.'],disjoint:['Groupes disjoints','Même position dans chaque bloc : tous différents.','Les cases à la même position dans leurs blocs (tous les coins haut-gauche, tous les centres…) forment des groupes qui contiennent chaque symbole une fois.'],centerdot:['Point central','Les centres des blocs forment un groupe de plus.','Les cases centrales de tous les blocs contiennent ensemble chaque symbole une fois.'],asterisk:['Astérisque','Neuf cases grisées en étoile.','Les neuf cases grisées qui forment un astérisque contiennent chaque symbole une fois.'],girandola:['Girandola','Neuf cases grisées en moulinet.','Les neuf cases grisées (les coins, le centre et un moulinet autour) contiennent chaque symbole une fois.'],antiknight:['Anti-cavalier','Deux symboles égaux ne sont jamais à un saut de cavalier.','Règles classiques, et deux cases séparées par un saut de cavalier (deux pas dans un sens, un dans l’autre) ne contiennent jamais le même symbole.'],antiking:['Anti-roi','Deux symboles égaux ne se touchent jamais en diagonale.','Règles classiques, et deux cases qui se touchent en diagonale (un pas de roi) ne contiennent jamais le même symbole.'],nonconsecutive:['Non consécutif','Des voisins ne diffèrent jamais de 1.','Deux cases qui partagent un côté ne contiennent jamais des nombres consécutifs (comme 4 et 5).'],magic:['Carré magique','Le bloc central est un carré magique.','Règles classiques 9×9, et dans le bloc central grisé chaque ligne, chaque colonne et les deux diagonales font 15.'],killer:['Killer','Des cages avec des sommes, sans répétition.','Les cages en pointillés indiquent la somme de leurs cases. Aucun symbole ne se répète dans une cage. En général, peu de symboles, voire aucun, sont donnés.'],evenodd:['Pair–impair','Cercle : impair, carré : pair.','Un cercle gris contient un nombre impair, un carré gris un nombre pair.'],kropki:['Kropki','Point blanc : consécutifs. Point noir : l’un est le double.','Un point blanc entre deux cases : leurs nombres diffèrent de 1. Un point noir : l’un est le double de l’autre (entre 1 et 2, les deux points sont possibles).\nTous les points sont donnés : des voisins sans point n’ont aucune de ces relations.'],xv:['XV','X : somme 10, V : somme 5.','Deux cases reliées par un X font 10, par un V font 5.\nTous les X et V sont montrés : les autres voisins ne font ni 10 ni 5.'],consecutive:['Consécutif','Des barres relient des nombres consécutifs.','Une barre entre deux cases : leurs nombres diffèrent de 1.\nToutes les barres sont montrées : des voisins sans barre ne sont jamais consécutifs.'],greater:['Plus grand que','Des signes indiquent le voisin le plus grand.','Le chevron entre deux cases pointe vers le plus petit nombre.'],quadruple:['Quadruple','Les cercles listent des symboles des quatre cases autour.','Un cercle au coin de quatre cases liste des symboles présents dans ces quatre cases.'],thermo:['Thermomètre','Les nombres montent depuis le bulbe.','Le long de chaque thermomètre, les nombres augmentent strictement du bulbe vers l’autre bout.'],arrow:['Flèche','Le cercle vaut la somme le long de sa flèche.','Le nombre dans un cercle est la somme des nombres le long de sa flèche. Les nombres peuvent se répéter sur une flèche si les autres règles le permettent.'],renban:['Renban','Une ligne contient une suite de nombres consécutifs.','Chaque ligne violette contient des nombres différents et consécutifs, dans n’importe quel ordre (par exemple 4 6 5 3).'],whisper:['Murmures allemands','Voisins sur la ligne : écart d’au moins 5.','Deux cases voisines le long d’une ligne verte diffèrent d’au moins 5 (en 9×9 ; sinon d’au moins la moitié de la taille, arrondie au-dessus).'],dutch:['Murmures hollandais','Voisins sur la ligne : écart d’au moins 4.','Deux cases voisines le long d’une ligne orange diffèrent d’au moins 4 (la moitié de la taille, arrondie au-dessous).'],palindrome:['Palindrome','Les lignes se lisent de la même façon dans les deux sens.','Chaque ligne grise se lit de la même façon depuis ses deux bouts : les cases à égale distance des bouts contiennent le même symbole.'],parityline:['Ligne de parité','Pairs et impairs alternent.','Le long d’une ligne rouge, nombres pairs et impairs alternent.'],between:['Ligne « entre »','Les cases intérieures sont entre les bouts.','Sur une ligne avec un cercle à chaque bout, chaque case intérieure contient un nombre strictement compris entre les deux nombres cerclés.'],zipper:['Fermeture éclair','Les paires autour du milieu ont la même somme.','Sur une ligne fermeture éclair, les cases à égale distance du centre font ensemble le nombre de la case centrale.'],entropic:['Ligne entropique','Trois de suite : un petit, un moyen, un grand.','Les nombres forment trois groupes (en 9×9 : 1–3 petits, 4–6 moyens, 7–9 grands). Trois cases voisines le long d’une ligne jaune contiennent un nombre de chaque groupe.'],modular:['Ligne modulaire','Trois de suite : restes différents modulo 3.','Trois cases voisines le long d’une ligne turquoise ont des restes différents dans la division par 3 (un de 1 4 7, un de 2 5 8, un de 3 6 9).'],sandwich:['Sandwich','Sommes entre le plus petit et le plus grand.','Un nombre hors de la grille est la somme des nombres entre le 1 et le plus grand nombre (9 en 9×9) de cette ligne ou colonne.'],skyscraper:['Gratte-ciel','Combien de tours on voit depuis le côté.','Les nombres sont des tours de cette hauteur. Un indice extérieur dit combien de tours sont visibles de là : les plus hautes cachent les plus basses derrière elles.'],xsums:['Sommes X','Les X premières cases font l’indice.','Un indice extérieur est la somme des X premiers nombres vus de ce côté, X étant le premier de ces nombres.'],frame:['Cadre','Sommes des premières cases près du cadre.','Un indice extérieur est la somme des premiers nombres vus de ce côté, autant qu’un bloc est large (ou haut) : trois en 9×9.'],littlekiller:['Petit killer','Des sommes le long des diagonales, données à l’extérieur.','Une petite flèche hors de la grille suit une diagonale ; l’indice est la somme de tous ses nombres. Les nombres peuvent se répéter sur une diagonale.'],},es:{classic:['Clásico','El original: filas, columnas y cajas tienen cada símbolo una vez.','Cada fila, cada columna y cada caja marcada contiene cada símbolo exactamente una vez.\nLas cuadrículas grandes siguen con letras después del 9. Los tamaños que no son cuadrados usan cajas de otra forma (2×3, 3×4, 4×5…) o ninguna caja: entonces es un cuadrado latino.'],jigsaw:['Jigsaw','Regiones irregulares en lugar de cajas.','Las cajas se sustituyen por regiones irregulares, sombreadas en tonos alternos. Cada fila, columna y región contiene cada símbolo una vez.'],samurai:['Samurái','Cinco cuadrículas superpuestas en cruz.','Cinco cuadrículas se superponen por sus cajas de esquina. Cada una sigue las reglas clásicas; una caja compartida pertenece a dos cuadrículas a la vez.'],twodoku:['Twodoku','Dos cuadrículas que comparten una caja.','Dos cuadrículas clásicas se superponen en una caja, que debe cumplir con ambas.'],butterfly:['Mariposa','Cuatro cuadrículas dentro de un cuadrado.','Cuatro cuadrículas desplazadas una caja se superponen en un solo cuadrado (12×12 para cuadrículas de 9×9). Todas siguen las reglas clásicas.'],sohei:['Sohei','Cuatro cuadrículas en anillo alrededor de un centro vacío.','Cuatro cuadrículas forman un anillo; cada una comparte una caja de esquina con dos vecinas. Las cuatro siguen las reglas clásicas.'],flower:['Flor','Una cuadrícula central con cuatro pétalos.','Una cuadrícula central y cuatro desplazadas una caja arriba, abajo, a la izquierda y a la derecha. Las cinco siguen las reglas clásicas.'],diagonal:['Diagonal (X)','Las dos diagonales principales tienen cada símbolo una vez.','Reglas clásicas, y cada una de las dos diagonales principales también contiene cada símbolo exactamente una vez.'],windoku:['Windoku','Ventanas sombreadas adicionales.','Reglas clásicas más ventanas sombreadas del tamaño de una caja, a una celda de las esquinas de las cajas (cuatro en 9×9). Cada ventana también contiene cada símbolo una vez.'],disjoint:['Grupos disjuntos','La misma posición en cada caja: todos distintos.','Las celdas en la misma posición de sus cajas (todas las de arriba a la izquierda, todas las centrales…) forman grupos que contienen cada símbolo una vez.'],centerdot:['Punto central','Los centros de las cajas forman otro grupo.','Las celdas centrales de todas las cajas contienen juntas cada símbolo una vez.'],asterisk:['Asterisco','Nueve celdas sombreadas en estrella.','Las nueve celdas sombreadas que forman un asterisco contienen cada símbolo una vez.'],girandola:['Girándula','Nueve celdas sombreadas en molinillo.','Las nueve celdas sombreadas (las esquinas, el centro y un molinillo a su alrededor) contienen cada símbolo una vez.'],antiknight:['Anticaballo','Símbolos iguales nunca a un salto de caballo.','Reglas clásicas, y dos celdas a un salto de caballo (dos pasos en una dirección y uno en la otra) nunca contienen el mismo símbolo.'],antiking:['Antirrey','Símbolos iguales nunca se tocan en diagonal.','Reglas clásicas, y las celdas que se tocan en diagonal (un paso de rey) nunca contienen el mismo símbolo.'],nonconsecutive:['No consecutivo','Los vecinos nunca difieren en 1.','Las celdas que comparten un lado nunca contienen números consecutivos (como 4 y 5).'],magic:['Cuadrado mágico','La caja central es un cuadrado mágico.','Reglas clásicas de 9×9 y, en la caja central sombreada, cada fila, cada columna y las dos diagonales suman 15.'],killer:['Killer','Jaulas con sumas, sin repetir dentro.','Las jaulas punteadas muestran la suma de sus celdas. Los símbolos no se repiten dentro de una jaula. Normalmente se dan pocos símbolos o ninguno.'],evenodd:['Par–impar','Círculos impares, cuadrados pares.','Un círculo gris contiene un número impar; un cuadrado gris, uno par.'],kropki:['Kropki','Punto blanco: consecutivos. Negro: uno es el doble.','Un punto blanco entre dos celdas: sus números difieren en 1. Un punto negro: uno es el doble del otro (entre 1 y 2 puede aparecer cualquiera de los dos).\nSe dan todos los puntos: los vecinos sin punto no tienen ninguna de las dos relaciones.'],xv:['XV','X: suman 10. V: suman 5.','Dos celdas unidas por una X suman 10; por una V, 5.\nSe muestran todas las X y V: los demás vecinos no suman ni 10 ni 5.'],consecutive:['Consecutivo','Barras unen números consecutivos.','Una barra entre dos celdas: sus números difieren en 1.\nSe muestran todas las barras: los vecinos sin barra nunca son consecutivos.'],greater:['Mayor que','Los signos indican qué vecino es mayor.','El ángulo entre dos celdas apunta al número menor.'],quadruple:['Cuádruple','Los círculos indican símbolos de las cuatro celdas.','Un círculo en la esquina de cuatro celdas indica símbolos que aparecen en esas cuatro celdas.'],thermo:['Termómetro','Los números suben desde el bulbo.','A lo largo de cada termómetro, los números crecen estrictamente desde el bulbo hasta el otro extremo.'],arrow:['Flecha','El círculo es la suma a lo largo de su flecha.','El número de un círculo es la suma de los números a lo largo de su flecha. Los números pueden repetirse en una flecha si las demás reglas lo permiten.'],renban:['Renban','Una línea tiene números consecutivos.','Cada línea morada contiene números distintos y consecutivos en cualquier orden (por ejemplo 4 6 5 3).'],whisper:['Susurros alemanes','Vecinos en la línea difieren en al menos 5.','Las celdas contiguas a lo largo de una línea verde difieren en al menos 5 (en 9×9; en otros tamaños, al menos la mitad del tamaño, redondeando hacia arriba).'],dutch:['Susurros holandeses','Vecinos en la línea difieren en al menos 4.','Las celdas contiguas a lo largo de una línea naranja difieren en al menos 4 (la mitad del tamaño, redondeando hacia abajo).'],palindrome:['Palíndromo','Las líneas se leen igual en ambos sentidos.','Cada línea gris se lee igual desde ambos extremos: las celdas a igual distancia de los extremos tienen el mismo símbolo.'],parityline:['Línea de paridad','Pares e impares se alternan.','A lo largo de una línea roja se alternan números pares e impares.'],between:['Línea «entre»','Las celdas interiores están entre los extremos.','En una línea con círculos en ambos extremos, cada celda interior contiene un número estrictamente entre los dos números de los círculos.'],zipper:['Cremallera','Los pares alrededor del centro suman lo mismo.','En una línea cremallera, las celdas a igual distancia del centro suman el número de la celda central.'],entropic:['Línea entrópica','Tres seguidas: baja, media y alta.','Los números forman tres grupos (en 9×9: 1–3 bajos, 4–6 medios, 7–9 altos). Tres celdas contiguas de una línea amarilla tienen un número de cada grupo.'],modular:['Línea modular','Tres seguidas: restos distintos al dividir por 3.','Tres celdas contiguas de una línea turquesa dejan restos distintos al dividir por 3 (uno de 1 4 7, uno de 2 5 8, uno de 3 6 9).'],sandwich:['Sándwich','Sumas entre el menor y el mayor.','Un número fuera de la cuadrícula es la suma de los números entre el 1 y el número mayor (9 en 9×9) de esa fila o columna.'],skyscraper:['Rascacielos','Cuántas torres se ven desde el lado.','Los números son torres de esa altura. Una pista exterior indica cuántas torres se ven desde ahí: las más altas tapan a las más bajas detrás.'],xsums:['Sumas X','Las primeras X celdas suman la pista.','Una pista exterior es la suma de los primeros X números vistos desde ese lado, donde X es el primero de ellos.'],frame:['Marco','Sumas de las primeras celdas junto al marco.','Una pista exterior es la suma de los primeros números vistos desde ese lado, tantos como el ancho (o alto) de una caja: tres en 9×9.'],littlekiller:['Pequeño killer','Sumas por diagonales, dadas desde fuera.','Una flechita fuera de la cuadrícula señala una diagonal; la pista es la suma de todos sus números. Los números pueden repetirse en una diagonal.'],},ka:{classic:['კლასიკური','ორიგინალი: სტრიქონებში, სვეტებსა და ბლოკებში ყოველი სიმბოლო ერთხელაა.','ყოველ სტრიქონში, ყოველ სვეტსა და ყოველ შემოსაზღვრულ ბლოკში ყოველი სიმბოლო ზუსტად ერთხელ გვხვდება.\nდიდ ბადეებში 9-ის შემდეგ ასოები მოდის. ზომებს, რომლებიც კვადრატები არ არის, სხვა ფორმის ბლოკები აქვს (2×3, 3×4, 4×5…) ან საერთოდ არ აქვს ბლოკები — მაშინ ეს ლათინური კვადრატია.'],jigsaw:['ფაზლი','არარეგულარული არეები ბლოკების ნაცვლად.','ბლოკები შეცვლილია არარეგულარული ფორმის არეებით (მონაცვლე ფერებით). ყოველ სტრიქონში, სვეტსა და არეში ყოველი სიმბოლო ერთხელაა.'],samurai:['სამურაი','ხუთი გადაფარული ბადე ჯვრის ფორმით.','ხუთი ბადე კუთხის ბლოკებით გადაიფარება. ყოველი ბადე კლასიკურ წესებს ემორჩილება; საერთო ბლოკი ორ ბადეს ერთდროულად ეკუთვნის.'],twodoku:['ორმაგი','ორი ბადე საერთო კუთხის ბლოკით.','ორი კლასიკური ბადე ერთი ბლოკით გადაიფარება, რომელიც ორივეს უნდა აკმაყოფილებდეს.'],butterfly:['პეპელა','ოთხი ბადე ერთ კვადრატში.','ოთხი ბადე, ერთი ბლოკით წანაცვლებული, ერთ კვადრატში გადაიფარება (12×12 9×9 ბადეებისთვის). თითოეული კლასიკურ წესებს ემორჩილება.'],sohei:['სოჰეი','ოთხი ბადე რგოლად ცარიელი ცენტრის გარშემო.','ოთხი ბადე რგოლს ქმნის; თითოეულს ორ მეზობელთან საერთო კუთხის ბლოკი აქვს. ოთხივე კლასიკურ წესებს ემორჩილება.'],flower:['ყვავილი','ცენტრალური ბადე და ოთხი ფურცელი.','ცენტრალური ბადე და ოთხი ბადე, ერთი ბლოკით ზემოთ, ქვემოთ, მარცხნივ და მარჯვნივ წანაცვლებული. ხუთივე კლასიკურ წესებს ემორჩილება.'],diagonal:['დიაგონალური (X)','ორივე მთავარ დიაგონალზე ყოველი სიმბოლო ერთხელაა.','კლასიკური წესები და, ამასთან, ორივე მთავარ დიაგონალზეც ყოველი სიმბოლო ზუსტად ერთხელ გვხვდება.'],windoku:['ვინდოკუ','დამატებითი დაჩრდილული ფანჯრები.','კლასიკური წესები და ბლოკის ზომის დაჩრდილული ფანჯრები, ბლოკების კუთხეებიდან ერთი უჯრით დაშორებული (9×9-ზე ოთხი). ყოველ ფანჯარაშიც ყოველი სიმბოლო ერთხელაა.'],disjoint:['განცალკევებული ჯგუფები','ყოველ ბლოკში ერთი და იგივე ადგილი — სულ სხვადასხვა.','უჯრები, რომლებიც თავიანთ ბლოკებში ერთსა და იმავე ადგილზე დგას (ყველა ზედა მარცხენა, ყველა ცენტრალური…), ქმნის ჯგუფებს, სადაც ყოველი სიმბოლო ერთხელაა.'],centerdot:['ცენტრალური წერტილი','ბლოკების ცენტრები კიდევ ერთი ჯგუფია.','ყველა ბლოკის ცენტრალური უჯრა ერთად ყოველ სიმბოლოს ერთხელ შეიცავს.'],asterisk:['ვარსკვლავი','ცხრა დაჩრდილული უჯრა ვარსკვლავად.','ვარსკვლავის ფორმის ცხრა დაჩრდილული უჯრა ყოველ სიმბოლოს ერთხელ შეიცავს.'],girandola:['ჟირანდოლა','ცხრა დაჩრდილული უჯრა ფრფრად.','ცხრა დაჩრდილული უჯრა (კუთხეები, ცენტრი და ფრფრა მის გარშემო) ყოველ სიმბოლოს ერთხელ შეიცავს.'],antiknight:['ანტიმხედარი','ერთნაირი სიმბოლოები მხედრის სვლით არასოდეს დგას.','კლასიკური წესები და ორ უჯრაში, რომლებიც ერთმანეთისგან ჭადრაკის მხედრის სვლით არის დაშორებული (ორი ნაბიჯი ერთი მიმართულებით, ერთი — მეორით), ერთი და იგივე სიმბოლო არასოდეს დგას.'],antiking:['ანტიმეფე','ერთნაირი სიმბოლოები დიაგონალურად არ ეხება ერთმანეთს.','კლასიკური წესები და დიაგონალურად მოსაზღვრე უჯრებში (მეფის ნაბიჯი) ერთი და იგივე სიმბოლო არასოდეს დგას.'],nonconsecutive:['არამიმდევრობითი','მეზობლები 1-ით არასოდეს განსხვავდება.','საერთო გვერდის მქონე უჯრებში მიმდევრობითი რიცხვები (მაგ. 4 და 5) არასოდეს დგას.'],magic:['მაგიური კვადრატი','ცენტრალური ბლოკი მაგიური კვადრატია.','კლასიკური 9×9 წესები და დაჩრდილულ ცენტრალურ ბლოკში ყოველი სტრიქონის, ყოველი სვეტისა და ორივე დიაგონალის ჯამი 15-ია.'],killer:['კილერი','გალიები ჯამებით, გალიაში გამეორების გარეშე.','წყვეტილი გალიები თავიანთი უჯრების ჯამს აჩვენებს. გალიაში სიმბოლოები არ მეორდება. ჩვეულებრივ ცოტა სიმბოლოა მოცემული ან არც ერთი.'],evenodd:['ლუწი–კენტი','წრე — კენტი, კვადრატი — ლუწი.','ნაცრისფერ წრეში კენტი რიცხვია, ნაცრისფერ კვადრატში — ლუწი.'],kropki:['კროპკი','თეთრი წერტილი — მიმდევრობითი, შავი — ერთი მეორის ორმაგია.','თეთრი წერტილი ორ უჯრას შორის: რიცხვები 1-ით განსხვავდება. შავი წერტილი: ერთი რიცხვი მეორის ორმაგია (1-სა და 2-ს შორის ორივე წერტილი შეიძლება იყოს).\nყველა წერტილი მოცემულია: წერტილის გარეშე მეზობლებს არც ერთი ეს მიმართება არ აქვს.'],xv:['XV','X — ჯამი 10, V — ჯამი 5.','X-ით შეერთებული უჯრების ჯამი 10-ია, V-თი — 5.\nყველა X და V ნაჩვენებია: დანარჩენი მეზობლების ჯამი არც 10-ია და არც 5.'],consecutive:['მიმდევრობითი','ზოლი მიმდევრობით რიცხვებს აერთებს.','ზოლი ორ უჯრას შორის: რიცხვები 1-ით განსხვავდება.\nყველა ზოლი ნაჩვენებია: ზოლის გარეშე მეზობლები არასოდეს არის მიმდევრობითი.'],greater:['მეტია–ნაკლებია','ნიშნები აჩვენებს, რომელი მეზობელია მეტი.','კუთხე ორ უჯრას შორის წვეროთი ნაკლები რიცხვისკენაა მიმართული.'],quadruple:['ოთხეული','წრე ირგვლივ მდგომი ოთხი უჯრის სიმბოლოებს ჩამოთვლის.','წრე ოთხი უჯრის კუთხეზე ჩამოთვლის სიმბოლოებს, რომლებიც ამ ოთხ უჯრაში გვხვდება.'],thermo:['თერმომეტრი','რიცხვები ბოლქვიდან იზრდება.','ყოველ თერმომეტრზე რიცხვები მკაცრად იზრდება ბოლქვიდან მეორე ბოლომდე.'],arrow:['ისარი','წრეში რიცხვი ისრის გასწვრივ ჯამია.','წრეში მდგომი რიცხვი მისი ისრის გასწვრივ რიცხვების ჯამის ტოლია. ისარზე რიცხვები შეიძლება გამეორდეს, თუ სხვა წესები ამის ნებას რთავს.'],renban:['რენბანი','ხაზზე მიმდევრობითი რიცხვებია.','ყოველი იისფერი ხაზი შეიცავს სხვადასხვა მიმდევრობით რიცხვებს ნებისმიერი თანმიმდევრობით (მაგ. 4 6 5 3).'],whisper:['გერმანული ჩურჩული','ხაზზე მეზობლები სულ მცირე 5-ით განსხვავდება.','მწვანე ხაზის გასწვრივ მეზობელი უჯრები სულ მცირე 5-ით განსხვავდება (9×9-ზე; სხვა ზომებზე — სულ მცირე ზომის ნახევრით, ზემოთ დამრგვალებით).'],dutch:['ჰოლანდიური ჩურჩული','ხაზზე მეზობლები სულ მცირე 4-ით განსხვავდება.','ნარინჯისფერი ხაზის გასწვრივ მეზობელი უჯრები სულ
