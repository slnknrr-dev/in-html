<!doctype html>
<!-- sudoku-game/index.html: entry page. A shell, not a document: main.js builds the whole UI inside <main>.
     Why an empty shell: one render path (JS) owns content, i18n and state; static markup would duplicate it and
     drift. Cost accepted: nothing useful without JS (see <noscript>). singlefile.js inlines the CSS/JS below into
     the html@5_* builds and strips every comment, so these notes never ship. -->
<html lang="en">
<!-- lang="en" is the static default only; ui/i18n.js rewrites it on language switch (screen readers, hyphenation). -->
<head>
<meta charset="utf-8">
<!-- charset first: it must sit in the first 1024 bytes, before any non-ASCII byte, or the parser re-decodes the page. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Without a viewport meta, mobile browsers lay out at ~980px and zoom out, so no @media (max-width) in app.css fires. -->
<title>Sudoku Variants</title>
<meta name="description" content="Sudoku in 40 variants (killer, jigsaw, thermo, arrow, kropki, sandwich, samurai and many rare ones), any size from 4×4 to 25×25, explained hints, custom symbols, seeds, six looks, shared and race games with friends or bots.">
<meta name="color-scheme" content="light dark">
<!-- color-scheme: the UA paints scrollbars, form controls and the pre-CSS canvas dark when the OS is dark, so there is
     no white flash before ui/base.css loads its dark tokens. -->
<meta name="theme-color" content="#f6f7f9">
<!-- theme-color tints the mobile browser chrome. Static value = light "flat" skin; main.js rewrites this meta when the
     skin or dark mode changes, so the bar matches the board background. -->
<!-- Favicon as a URL-encoded SVG data: URI: zero requests, works from file:// and offline builds. '#' must be %23,
     otherwise it starts a URL fragment and truncates the image. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fdb'/%3E%3Cpath d='M12 4v24M20 4v24M4 12h24M4 20h24' stroke='%23fff' stroke-opacity='.55' stroke-width='1.6'/%3E%3Ctext x='16' y='20.6' font-family='Arial,sans-serif' font-weight='700' font-size='9' text-anchor='middle' fill='%23fff'%3E9%3C/text%3E%3C/svg%3E">
<!-- Cascade order is a contract (equal specificity: later file wins):
       1. ui/base.css  tokens (ed-* custom properties), reset, shared primitives (.ed-*)
       2. ui/app.css   app shell (.ap-*)
       3. ./app.css    this app (sg-*), may override 1-2 without !important
     Reordering breaks those overrides silently: no error, only wrong styles. -->
<link rel="stylesheet" href="../ui/base.css">
<link rel="stylesheet" href="../ui/app.css">
<link rel="stylesheet" href="./app.css">
</head>
<!-- data-skin="flat" is the default look, set in markup so the first paint already uses it; main.js overwrites it from
     saved prefs (body[data-skin] selectors in app.css). viewport-fit=cover above lets the board use the notch area. -->
<body class="ap" data-skin="flat">
<!-- #ed-loading: shared splash styled in ui/base.css; main.js removes it once the first view rendered. -->
<main class="ap-main sg-main" id="sg-main"><div id="ed-loading"><div class="ed-spinner"></div></div></main>
<!-- .ed-noscript is styled in ui/base.css as a top-layer banner; <noscript> is the only content a JS-less visitor sees. -->
<noscript><div class="ed-noscript">Sudoku Variants needs JavaScript. It runs entirely in your browser.</div></noscript>
<!-- type=module: deferred by default (runs after parsing, so #main exists), strict mode, own scope, and imports are
     resolved relative to this file. Modules do not load from file:// in Chromium; that is why the html@5_* single-file
     builds exist for offline use. -->
<script type="module" src="./main.js"></script>
</body>
</html>
